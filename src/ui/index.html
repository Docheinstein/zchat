<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>zchat</title>
<style>
  :root {
    --bg: #111317;
    --panel: #181b21;
    --border: #262a33;
    --text: #d6d9df;
    --muted: #7d8491;
    --accent: #6ea8ff;
    --input: #1e222a;
    --size: 14px;
    --font: "Cascadia Mono", "Cascadia Code", Consolas, Menlo, "DejaVu Sans Mono", "Liberation Mono", monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 13px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: grid; grid-template-columns: 210px 1fr; grid-template-rows: 44px 1fr; overflow: hidden;
  }
  header {
    grid-column: 1 / 3; display: flex; align-items: center; gap: 10px; padding: 0 12px;
    background: var(--panel); border-bottom: 1px solid var(--border);
  }
  header .title { font-weight: 600; font-size: 15px; letter-spacing: .3px; }
  header .channel { color: var(--muted); }
  header .spacer { flex: 1; }
  header button, header select {
    background: var(--input); color: var(--text); border: 1px solid var(--border); border-radius: 6px;
    height: 28px; padding: 0 8px; font: inherit; cursor: pointer;
  }
  header button:hover, header select:hover { border-color: var(--accent); }
  aside {
    background: var(--panel); border-right: 1px solid var(--border); overflow-y: auto; padding: 10px 0;
  }
  aside h2 {
    font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .8px; color: var(--muted);
    margin: 10px 14px 6px;
  }
  aside .item {
    display: flex; align-items: center; gap: 8px; padding: 4px 14px; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis;
  }
  aside .item.active { background: #232833; }
  /* Channels: clicked to join; private ones have a lock, those with something new a dot. */
  aside h2 { display: flex; align-items: center; }
  aside h2 .add {
    margin-left: auto; width: 20px; height: 20px; border-radius: 5px; border: 1px solid var(--border);
    background: var(--input); color: var(--text); cursor: pointer; font-size: 14px; line-height: 16px; padding: 0;
  }
  aside h2 .add:hover { border-color: var(--accent); }
  #channels .item { cursor: pointer; border-radius: 0; }
  #channels .item:hover { background: #20242d; }
  #channels .item.active { background: #232833; color: #fff; font-weight: 600; }
  #channels .item.away { color: var(--muted); }
  #channels .lock { font-size: 11px; opacity: .8; }
  #channels .dot { margin-left: auto; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
  /* Buttons on a channel in the list: join one we are not in, leave one we are (shown on hover). */
  #channels .item .act {
    margin-left: auto; flex: none; height: 20px; padding: 0 8px; border-radius: 10px; font: inherit; font-size: 11px;
    cursor: pointer; border: 1px solid var(--border); background: var(--input); color: var(--text);
  }
  #channels .item .act.join { border-color: var(--accent); color: var(--accent); }
  #channels .item .act.leave { display: none; width: 20px; padding: 0; border-radius: 50%; }
  #channels .item:hover .act.leave { display: block; }
  #channels .item:hover .dot { display: none; }
  #channels .item .act:hover { background: var(--accent); border-color: var(--accent); color: #0b0d10; }
  /* The current channel's buttons, in the header. */
  header .channel-actions { display: flex; gap: 6px; }
  header .channel-actions button[hidden] { display: none; }
  header button.danger:hover { border-color: #e5534b; color: #e5534b; }
  header button.armed { background: #e5534b; border-color: #e5534b; color: #fff; }
  /* Who is in the current channel, and who can be added. */
  #channel-panel {
    position: fixed; top: 50px; left: 222px; width: 300px; max-height: calc(100vh - 70px); overflow-y: auto;
    z-index: 15; display: none; background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px; box-shadow: 0 8px 28px #000a;
  }
  #channel-panel.open { display: block; }
  #channel-panel .title { display: flex; align-items: center; font-weight: 600; font-size: 14px; margin-bottom: 8px; }
  #channel-panel .title button { margin-left: auto; }
  #channel-panel h3 {
    font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .8px; color: var(--muted);
    margin: 12px 0 6px;
  }
  #channel-panel .person { display: flex; align-items: center; gap: 8px; padding: 4px 0; }
  #channel-panel .person .who { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #channel-panel .note { color: var(--muted); font-size: 12px; padding: 4px 0; }
  #channel-panel button {
    background: var(--input); color: var(--text); border: 1px solid var(--border); border-radius: 6px;
    height: 26px; padding: 0 10px; font: inherit; font-size: 12px; cursor: pointer;
  }
  #channel-panel button:hover { border-color: var(--accent); }
  #channel-panel button.add { border-color: var(--accent); color: var(--accent); }
  #channel-panel button.remove:hover { border-color: #e5534b; color: #e5534b; }
  /* The dice window, when the web view cannot open a real one: floating, dragged by its title. */
  #dice-float {
    position: fixed; top: 60px; right: 24px; width: 360px; z-index: 18; display: none; background: #111317;
    border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 10px 34px #000b; overflow: hidden;
  }
  #dice-float.open { display: block; }
  #dice-float-title {
    display: flex; align-items: center; padding: 6px 10px; background: var(--panel); cursor: move; color: var(--muted);
    font-size: 12px; user-select: none;
  }
  #dice-float-title button { margin-left: auto; background: none; border: 0; color: var(--muted); font-size: 16px; cursor: pointer; }
  /* The same for the casino. A table taking bets or being played lights its button up. */
  #casino-float {
    position: fixed; top: 54px; right: 20px; width: min(780px, calc(100vw - 40px)); z-index: 18; display: none;
    background: #0f1a14; border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 10px 34px #000b; overflow: hidden;
  }
  #casino-float.open { display: block; }
  #casino-float-title {
    display: flex; align-items: center; padding: 6px 10px; background: var(--panel); cursor: move; color: var(--muted);
    font-size: 12px; user-select: none;
  }
  #casino-float-title button { margin-left: auto; background: none; border: 0; color: var(--muted); font-size: 16px; cursor: pointer; }
  /* The Poké Ball of the Pokémon buttons: there is no emoji for it. */
  svg.pokeball { width: 1em; height: 1em; vertical-align: -.15em; }
  header button#casino-open.live { border-color: #3fb950; color: #3fb950; }
  /* The same for the Pokémon battle. */
  #pk-float {
    position: fixed; top: 54px; right: 20px; width: min(1000px, calc(100vw - 40px)); z-index: 18; display: none;
    background: #111317; border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 10px 34px #000b; overflow: hidden;
  }
  #pk-float.open { display: block; }
  #pk-float-title {
    display: flex; align-items: center; padding: 6px 10px; background: var(--panel); cursor: move; color: var(--muted);
    font-size: 12px; user-select: none;
  }
  #pk-float-title button { margin-left: auto; background: none; border: 0; color: var(--muted); font-size: 16px; cursor: pointer; }
  /* The same for bomber. */
  #bm-float {
    position: fixed; top: 54px; right: 20px; width: min(860px, calc(100vw - 40px)); z-index: 18; display: none;
    background: #111317; border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 10px 34px #000b; overflow: hidden;
  }
  #bm-float.open { display: block; }
  #bm-float-title {
    display: flex; align-items: center; padding: 6px 10px; background: var(--panel); cursor: move; color: var(--muted);
    font-size: 12px; user-select: none;
  }
  #bm-float-title button { margin-left: auto; background: none; border: 0; color: var(--muted); font-size: 16px; cursor: pointer; }
  #bm-float:focus-within { border-color: var(--accent); }
  /* And for arena. */
  #am-float {
    position: fixed; top: 54px; right: 20px; width: min(920px, calc(100vw - 40px)); z-index: 18; display: none;
    background: #111317; border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 10px 34px #000b; overflow: hidden;
  }
  #am-float.open { display: block; }
  #am-float-title {
    display: flex; align-items: center; padding: 6px 10px; background: var(--panel); cursor: move; color: var(--muted);
    font-size: 12px; user-select: none;
  }
  #am-float-title button { margin-left: auto; background: none; border: 0; color: var(--muted); font-size: 16px; cursor: pointer; }
  #am-float:focus-within { border-color: var(--accent); }
  #new-channel { display: none; margin: 4px 14px 8px; }
  #new-channel.open { display: block; }
  #new-channel input, #new-channel select {
    width: 100%; background: var(--input); color: var(--text); border: 1px solid var(--border); border-radius: 6px;
    padding: 6px 8px; font: inherit; outline: none; margin-bottom: 6px;
  }
  #new-channel input:focus { border-color: var(--accent); }
  #new-channel .row { display: flex; gap: 6px; }
  #new-channel button {
    flex: 1; background: var(--input); color: var(--text); border: 1px solid var(--border); border-radius: 6px;
    height: 28px; font: inherit; cursor: pointer;
  }
  #new-channel button.primary { background: var(--accent); border-color: var(--accent); color: #0b0d10; font-weight: 600; }
  .avatar {
    flex: none; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center;
    font-size: 11px; font-weight: 700; color: #111;
  }
  /* Who we are, above the channels. */
  #me {
    display: flex; align-items: center; gap: 10px; margin: 0 8px 6px; padding: 8px 8px 12px;
    border-bottom: 1px solid var(--border); min-width: 0;
  }
  #me { cursor: pointer; border-radius: 8px 8px 0 0; }
  #me:hover { background: #20242d; }
  #me .avatar { width: 34px; height: 34px; font-size: 15px; }
  #me .who { min-width: 0; }
  #me .name { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #me .status { color: var(--muted); font-size: 11px; }
  #me .coins { margin-left: 6px; color: #e3b341; cursor: pointer; }
  #me .coins:empty { display: none; }
  #me .coins:hover { text-decoration: underline; }
  #me .status::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    background: #3fb950; margin-right: 5px; vertical-align: 1px; }
  /* An avatar picture fills its circle, cropped to it. */
  .avatar { overflow: hidden; }
  .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  #mentions div { display: flex; align-items: center; gap: 8px; }
  #mentions .avatar { width: 18px; height: 18px; font-size: 10px; }
  #profile .preview .avatar { width: 48px; height: 48px; font-size: 20px; }
  #profile .avatar-row { display: flex; gap: 8px; margin-bottom: 4px; }
  #profile .note { color: var(--muted); font-size: 11px; margin-bottom: 12px; min-height: 14px; }
  main { display: flex; flex-direction: column; min-width: 0; min-height: 0; position: relative; }
  /* Pokémon challenges waiting for an answer: cards over the top of the chat. */
  #challenges { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); z-index: 20;
    display: flex; flex-direction: column; gap: 8px; width: min(440px, calc(100% - 24px)); pointer-events: none; }
  .challenge { pointer-events: auto; background: var(--panel); border: 1px solid var(--accent); border-radius: 10px;
    padding: 12px 14px; box-shadow: 0 8px 28px rgba(0, 0, 0, .45); animation: challenge-in .25s ease-out; }
  @keyframes challenge-in { from { opacity: 0; transform: translateY(-12px); } to { opacity: 1; transform: none; } }
  .challenge .what { font-size: 14px; line-height: 1.4; }
  .challenge .what b { font-weight: 700; }
  .challenge .what .sub { display: block; color: var(--muted); font-size: 12px; }
  .challenge .row { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
  .challenge button { height: 32px; padding: 0 16px; border-radius: 7px; font: inherit; font-weight: 600; cursor: pointer;
    border: 1px solid var(--border); background: var(--input); color: var(--text); }
  .challenge button.accept { background: var(--accent); border-color: var(--accent); color: #0b0d10; }
  .challenge button:hover { filter: brightness(1.12); }
  #pk-challenges, #kick-votes { display: flex; flex-direction: column; gap: 8px; }
  #pk-challenges:empty, #kick-votes:empty { display: none; }
  .challenge.kick { border-color: #ff6b6b; }
  .challenge button.kick { background: #ff6b6b; border-color: #ff6b6b; color: #0b0d10; }
  .challenge .left { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; }
  #log {
    flex: 1; overflow-y: auto; padding: 10px 14px; font-family: var(--font); font-size: var(--size);
    line-height: 1.35;
  }
  #log .line { white-space: pre-wrap; overflow-wrap: anywhere; }
  /* Pictures and the paint canvas: characters touching, like in a terminal. */
  #log .block { white-space: pre; line-height: 1; overflow-x: auto; overflow-y: hidden; padding-bottom: 2px; }
  #log .file { display: flex; align-items: center; gap: 10px; margin: 4px 0 6px 6ch; padding: 8px 12px;
    width: fit-content; max-width: calc(100% - 6ch); box-sizing: border-box; border: 1px solid var(--border);
    border-radius: 8px; }
  #log .file .name { font-weight: 600; overflow-wrap: anywhere; }
  #log .file .size { opacity: 0.6; white-space: nowrap; }
  #log .file button { font: inherit; padding: 2px 10px; cursor: pointer; border-radius: 6px;
    border: 1px solid var(--border); background: transparent; color: inherit; }
  #log .file button:hover { border-color: var(--accent); }
  #log .picture img {
    display: block; margin: 4px 0 6px 6ch; max-width: min(100% - 6ch, 480px); height: auto; max-height: 480px;
    object-fit: contain; border-radius: 6px; cursor: zoom-in; background: #000;
  }
  #viewer {
    position: fixed; inset: 0; display: none; place-items: center; background: #000c; z-index: 20; cursor: zoom-out;
  }
  /* As big as the window allows, even for a small picture. */
  #viewer img { height: 88vh; width: auto; max-width: 92vw; object-fit: contain; border-radius: 6px; }
  #inputbar { position: relative; padding: 10px 14px 14px; border-top: 1px solid var(--border); }
  #input {
    width: 100%; background: var(--input); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 12px; font-family: var(--font); font-size: var(--size); outline: none;
  }
  #input:focus { border-color: var(--accent); }
  /* Changing our name and color: opened by clicking them, above the channels. */
  #profile {
    position: fixed; top: 112px; left: 8px; width: 264px; z-index: 15; display: none;
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 12px;
    box-shadow: 0 8px 28px #000a;
  }
  #profile.open { display: block; }
  /* Challenging someone to a Pokémon battle: a dialog in the look of the profile one, over a dimmed chat. */
  #pk-challenge { position: fixed; inset: 0; z-index: 25; display: none; place-items: start center; padding-top: 90px; background: #0008; }
  #pk-challenge.open { display: grid; }
  #pk-challenge .box {
    width: 380px; max-width: calc(100vw - 24px); background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px; box-shadow: 0 8px 28px #000a;
  }
  #pk-challenge .title { font-weight: 600; font-size: 14px; margin-bottom: 12px; }
  #pk-challenge label { display: block; color: var(--muted); font-size: 11px; font-weight: 600; text-transform: uppercase;
    letter-spacing: .8px; margin: 2px 0 6px; }
  #pk-challenge select {
    width: 100%; background: var(--input); color: var(--text); border: 1px solid var(--border); border-radius: 6px;
    padding: 7px 9px; font: inherit; font-size: 13px; outline: none; margin-bottom: 12px;
  }
  #pk-challenge select:focus { border-color: var(--accent); }
  #pk-challenge .note { color: var(--muted); font-size: 12px; margin: -6px 0 12px; }
  #pk-challenge .gens { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
  #pk-challenge .gens label { margin: 0; text-transform: none; letter-spacing: 0; font-size: 12px; cursor: pointer; }
  #pk-challenge .gens input { position: absolute; opacity: 0; pointer-events: none; }
  #pk-challenge .gens span {
    display: block; padding: 5px 9px; border-radius: 6px; border: 1px solid var(--border); background: var(--input); color: var(--text);
  }
  #pk-challenge .gens label:hover span { border-color: var(--accent); }
  #pk-challenge .gens input:checked + span { background: var(--accent); border-color: var(--accent); color: #0b0d10; font-weight: 600; }
  #pk-challenge .gens input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 1px; }
  #pk-challenge .buttons { display: flex; gap: 8px; justify-content: flex-end; }
  #pk-challenge button {
    background: var(--input); color: var(--text); border: 1px solid var(--border); border-radius: 6px;
    height: 30px; padding: 0 12px; font: inherit; cursor: pointer;
  }
  #pk-challenge button:hover { border-color: var(--accent); }
  #pk-challenge button.primary { background: var(--accent); border-color: var(--accent); color: #0b0d10; font-weight: 600; }
  #pk-challenge button:disabled { opacity: .4; cursor: default; }
  #profile label { display: block; color: var(--muted); font-size: 11px; font-weight: 600; text-transform: uppercase;
    letter-spacing: .8px; margin: 2px 0 6px; }
  #profile input[type=text] {
    width: 100%; background: var(--input); color: var(--text); border: 1px solid var(--border); border-radius: 6px;
    padding: 7px 9px; font: inherit; font-size: 13px; outline: none; margin-bottom: 12px;
  }
  #profile input[type=text]:focus { border-color: var(--accent); }
  #profile .colors { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  #profile input[type=color] {
    width: 44px; height: 32px; padding: 0; border: 1px solid var(--border); border-radius: 6px; background: none;
    cursor: pointer;
  }
  #profile .hex { font-family: var(--font); color: var(--muted); flex: 1; }
  #profile .swatches { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; margin-bottom: 12px; }
  #profile .swatches span { height: 22px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; }
  #profile .swatches span:hover { border-color: var(--text); }
  #profile .preview { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; font-weight: 600; }
  #profile .buttons { display: flex; gap: 8px; justify-content: flex-end; }
  #profile button {
    background: var(--input); color: var(--text); border: 1px solid var(--border); border-radius: 6px;
    height: 30px; padding: 0 12px; font: inherit; cursor: pointer;
  }
  #profile button:hover { border-color: var(--accent); }
  #profile button.primary { background: var(--accent); border-color: var(--accent); color: #0b0d10; font-weight: 600; }
  #mentions {
    position: absolute; left: 14px; bottom: 58px; min-width: 220px; max-height: 240px; overflow-y: auto;
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 4px 0;
    box-shadow: 0 6px 20px #0008; display: none; font-family: var(--font); font-size: var(--size);
  }
  #mentions div { padding: 4px 12px; cursor: pointer; }
  #mentions div.selected { background: #2a3140; }
  #drop {
    position: fixed; inset: 0; display: none; place-items: center; background: #0b0d10cc;
    border: 3px dashed var(--accent); font-size: 20px; color: var(--accent); z-index: 10;
  }
  body.dragging #drop { display: grid; }
</style>
<style id="dice-style"></style>
<style id="pk-style"></style>
<style id="casino-style"></style>
<style id="bm-style"></style>
<style id="am-style"></style>
</head>
<body>
<header>
  <span class="title">zchat</span>
  <span class="channel" id="channel"></span>
  <span class="channel-actions">
    <button id="channel-members" title="Who is in this channel; add or remove people">Members</button>
    <button id="channel-leave" class="danger" title="Leave this channel" hidden>Leave</button>
    <button id="channel-delete" class="danger" title="Delete this channel, for everybody" hidden>Delete</button>
  </span>
  <span class="spacer"></span>
  <button id="casino-open" title="The casino: blackjack, roulette and the horse race, for coins">🎰 Casino</button>
  <button id="pk-challenge-open" title="Challenge someone to a Pokémon battle"><svg class="pokeball" viewBox="0 0 16 16" aria-hidden="true"><path d="M1 8a7 7 0 0 1 14 0z" fill="#e5534b"/><path d="M1 8a7 7 0 0 0 14 0z" fill="#f4f4f4"/><circle cx="8" cy="8" r="7" fill="none" stroke="#15161a" stroke-width="1.2"/><path d="M1 8h14" stroke="#15161a" stroke-width="1.4"/><circle cx="8" cy="8" r="2.3" fill="#f4f4f4" stroke="#15161a" stroke-width="1.2"/></svg> Pokémon</button>
  <button id="dice-open" title="Dice" hidden>🎲</button>
  <button id="pk-open" title="Your Pokémon battle: show it again" hidden><svg class="pokeball" viewBox="0 0 16 16" aria-hidden="true"><path d="M1 8a7 7 0 0 1 14 0z" fill="#e5534b"/><path d="M1 8a7 7 0 0 0 14 0z" fill="#f4f4f4"/><circle cx="8" cy="8" r="7" fill="none" stroke="#15161a" stroke-width="1.2"/><path d="M1 8h14" stroke="#15161a" stroke-width="1.4"/><circle cx="8" cy="8" r="2.3" fill="#f4f4f4" stroke="#15161a" stroke-width="1.2"/></svg></button>
  <button id="bm-open" title="Bomber: start a round, or show the one on">💣 Bomber</button>
  <button id="am-open" title="Arena: start a round of the shooter, or show the one on">🎯 Arena</button>
  <select id="font" title="Font"></select>
  <button id="smaller" title="Smaller text">A−</button>
  <button id="bigger" title="Bigger text">A+</button>
</header>
<aside>
  <div id="me" title="Change your name and color"><span class="avatar"></span>
    <div class="who"><div class="name"></div><div class="status">online<span class="coins" title="Your coins, won in the games: click for what they buy"></span></div></div></div>
  <h2>Channels <button class="add" id="add-channel" title="New channel">+</button></h2>
  <div id="new-channel">

<script>
"use strict";
// The C++ side calls zchat.print(), zchat.bell() and zchat.info(); it is called through the functions it binds:
// zchatReady(), zchatSend(line), zchatMentions(), zchatSelf(), zchatAvatar(hash), zchatChannels(), zchatChannelPeople(channel), zchatRewrite(line), zchatDrop(name, base64), zchatDroppedFile(), zchatSettings()
// and zchatSaveSettings(size, font).
const log = document.getElementById("log");
const input = document.getElementById("input");
const mentionsBox = document.getElementById("mentions");

// --- Settings: text size and font, remembered in zchat's config file (zchatSettings / zchatSaveSettings).
const fonts = [
  ["Default", "var(--font)"], ["Cascadia Mono", '"Cascadia Mono"'], ["Consolas", "Consolas"], ["Menlo", "Menlo"],
  ["DejaVu Sans Mono", '"DejaVu Sans Mono"'], ["Courier New", '"Courier New"'],
];
const settings = {};
function saveSettings() {
  try { window.zchatSaveSettings(String(settings.size || ""), settings.font || ""); } catch {}
}
function applySettings() {
  document.documentElement.style.setProperty("--size", (settings.size || 14) + "px");
  const font = fonts.find(f => f[0] === settings.font) || fonts[0];
  log.style.fontFamily = input.style.fontFamily = mentionsBox.style.fontFamily =
    font[1] === "var(--font)" ? "" : font[1] + ", var(--font)";
}
const fontSelect = document.getElementById("font");
for (const [name] of fonts) {
  const o = document.createElement("option");
  o.textContent = name;
  fontSelect.appendChild(o);
}
fontSelect.value = settings.font || "Default";
fontSelect.onchange = () => { settings.font = fontSelect.value; saveSettings(); applySettings(); };
document.getElementById("smaller").onclick = () => {
  settings.size = Math.max(9, (settings.size || 14) - 1); saveSettings(); applySettings();
};
document.getElementById("bigger").onclick = () => {
  settings.size = Math.min(32, (settings.size || 14) + 1); saveSettings(); applySettings();
};
applySettings();

// --- ANSI (SGR) to HTML: the chat core writes lines as a terminal shows them.
function rgb(parts, i) { return `rgb(${parts[i]},${parts[i + 1]},${parts[i + 2]})`; }
const basic = ["#000", "#c33", "#3a3", "#cc3", "#36c", "#c3c", "#3cc", "#ccc"];
const bright = ["#7d8491", "#f66", "#6d6", "#ee6", "#69f", "#f6f", "#6ee", "#fff"];
function ansiToNodes(text, into) {
  let st = {};
  const parts = text.split(/\x1b\[([0-9;]*)m/);
  for (let i = 0; i < parts.length; i++) {
    if (i % 2 === 1) {
      const p = parts[i] === "" ? [0] : parts[i].split(";").map(Number);
      for (let j = 0; j < p.length; j++) {
        const c = p[j];
        if (c === 0) st = {};
        else if (c === 1) st.bold = true;
        else if (c === 22) st.bold = false;
        else if (c === 3) st.italic = true;
        else if (c === 23) st.italic = false;
        else if (c === 4) st.underline = true;
        else if (c === 24) st.underline = false;
        else if (c === 9) st.strike = true;
        else if (c === 29) st.strike = false;
        else if (c === 38 && p[j + 1] === 2) { st.fg = rgb(p, j + 2); j += 4; }
        else if (c === 48 && p[j + 1] === 2) { st.bg = rgb(p, j + 2); j += 4; }
        else if (c === 39) delete st.fg;
        else if (c === 49) delete st.bg;
        else if (c >= 30 && c <= 37) st.fg = basic[c - 30];
        else if (c >= 90 && c <= 97) st.fg = bright[c - 90];
        else if (c >= 40 && c <= 47) st.bg = basic[c - 40];
      }
      continue;
    }
    if (!parts[i]) continue;
    const span = document.createElement("span");
    span.textContent = parts[i];
    if (st.fg) span.style.color = st.fg;
    if (st.bg) span.style.background = st.bg;
    if (st.bold) span.style.fontWeight = "bold";
    if (st.italic) span.style.fontStyle = "italic";
    const deco = [st.underline && "underline", st.strike && "line-through"].filter(Boolean).join(" ");
    if (deco) span.style.textDecoration = deco;
    into.appendChild(span);
  }
}

function atBottom() { return log.scrollHeight - log.scrollTop - log.clientHeight < 40; }

const maxLines = 3000;
window.zchat = {
  print(text) {
    const stick = atBottom();
    const div = document.createElement("div");
    // Several lines in one print are a picture (or the paint canvas): its characters touch.
    div.className = text.includes("\n") ? "block" : "line";
    ansiToNodes(text, div);
    log.appendChild(div);
    while (log.childElementCount > maxLines) log.firstElementChild.remove();
    if (stick) log.scrollTop = log.scrollHeight;
  },
  // A real picture: the line saying who sent it, then the picture, which can be opened big with a click. frames is
  // [[src, delay], ...]: one for a still picture or a GIF (which plays by itself), more for an animation.
  image(line, width, height, frames) {
    const stick = atBottom();
    const div = document.createElement("div");
    div.className = "picture";
    const head = document.createElement("div");
    head.className = "line";
    ansiToNodes(line, head);
    const img = document.createElement("img");
    img.width = width;
    img.height = height;
    img.alt = "picture";
    animate(img, frames);
    img.onclick = () => openViewer(frames);
    // Once, when it first shows (an animation loads each frame): kept at the bottom unless scrolled away since.
    img.addEventListener("load", () => {
      if (stick && log.scrollHeight - log.scrollTop - log.clientHeight < img.offsetHeight + 40) {
        log.scrollTop = log.scrollHeight;
      }
    }, { once: true });
    div.append(head, img);
    log.appendChild(div);
    while (log.childElementCount > maxLines) log.firstElementChild.remove();
    if (stick) log.scrollTop = log.scrollHeight;
  },
  // A file: the line saying who sent it, then its name and size, and a button that saves it (typing "/save INDEX").
  file(line, index, name, size) {
    const stick = atBottom();
    const div = document.createElement("div");
    const head = document.createElement("div");
    head.className = "line";
    ansiToNodes(line, head);
    const card = document.createElement("div");
    card.className = "file";
    const title = document.createElement("span");
    title.className = "name";
    title.textContent = "📎 " + name;
    const info = document.createElement("span");
    info.className = "size";
    info.textContent = size;
    const save = document.createElement("button");
    save.textContent = "Download";
    save.title = "Save it in your downloads folder";
    save.onclick = () => window.zchatSend("/save " + index);
    card.append(title, info, save);
    div.append(head, card);
    log.appendChild(div);
    while (log.childElementCount > maxLines) log.firstElementChild.remove();
    if (stick) log.scrollTop = log.scrollHeight;
  },
  bell() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator(), gain = ctx.createGain();
      osc.frequency.value = 880;
      gain.gain.setValueAtTime(0.15, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.25);
      osc.connect(gain).connect(ctx.destination);
      osc.start(); osc.stop(ctx.currentTime + 0.25);
    } catch {}
    if (!document.hasFocus()) {
      document.title = "(!) zchat";
      window.addEventListener("focus", () => { document.title = "zchat"; }, { once: true });
    }
  },
  info(i) {
    port = i.port || 0;
    showHeader();
  },
  // Another channel is joined: it shows only what is said there.
  clear() {
    log.textContent = "";
  },
};

// --- Channels: listed from zchatChannels() ([[name, public, member, current, unread], ...]); a click joins one.
// After #general comes the games log: what the games say goes there, and not in the chat.
const gamesLog = "games-log";
let port = 0, currentChannel = "general", channelsShown = "";
function showHeader() {
  document.getElementById("channel").textContent = "# " + currentChannel + (port ? `  ·  UDP port ${port}` : "");
}
async function refreshChannels() {
  let channels = [];
  try { channels = await window.zchatChannels(); } catch {}
  const shown = JSON.stringify(channels);
  if (shown === channelsShown) return;
  channelsShown = shown;
  const box = document.getElementById("channels");
  box.textContent = "";
  channelList = channels;
  for (const [name, isPublic, member, current, unread] of channels) {
    const item = document.createElement("div");
    const log = name === gamesLog;
    item.className = "item" + (current ? " active" : "") + (member ? "" : " away");
    item.title = log ? "What the games say, kept out of the chat"
      : (isPublic ? "Public" : "Private") + (member ? "" : ": click to join");
    const label = document.createElement("span");
    label.textContent = "# " + name;
    item.append(label);
    if (log) {
      const icon = document.createElement("span");
      icon.className = "lock";
      icon.textContent = "🎮";
      item.append(icon);
    } else if (!isPublic) {
      const lock = document.createElement("span");
      lock.className = "lock";
      lock.textContent = "🔒";
      item.append(lock);
    }
    if (unread && !current) {
      const dot = document.createElement("span");
      dot.className = "dot";
      item.append(dot);
    }
    if (!member) {
      const join = document.createElement("button");
      join.className = "act join";
      join.textContent = "Join";
      join.title = "Join #" + name;
      item.append(join);
    } else if (name !== "general" && !log) {
      const leave = document.createElement("button");
      leave.className = "act leave";
      leave.textContent = "×";
      leave.title = "Leave #" + name;
      leave.onclick = e => { e.stopPropagation(); channelCommand("/leave " + name); };
      item.append(leave);
    }
    item.onclick = () => channelCommand("/join " + name);
    box.appendChild(item);
    if (current) currentChannel = name;
  }
  showHeader();
  showChannelActions();
}
// Runs a channel command, as typed; what it says shows in the chat.
function channelCommand(line) {
  window.zchatSend(line);
  for (const ms of [150, 600]) setTimeout(() => { refreshChannels(); if (channelPanel.classList.contains("open")) showChannelPanel(); }, ms);
}
let channelList = [];
function showChannelActions() {
  const here = channelList.find(c => c[3]);
  const general = !here || here[0] === "general";
  const log = !!here && here[0] === gamesLog;
  document.getElementById("channel-members").hidden = log;
  document.getElementById("channel-leave").hidden = general || log;
  document.getElementById("channel-delete").hidden = general || log || !here[5];
}
document.getElementById("channel-leave").onclick = () => channelCommand("/leave " + currentChannel);
// Deleting asks for a second click.
const deleteButton = document.getElementById("channel-delete");
deleteButton.onclick = () => {
  if (!deleteButton.classList.contains("armed")) {
    deleteButton.classList.add("armed");
    deleteButton.textContent = "Click again to delete";
    clearTimeout(deleteButton._timer);
    deleteButton._timer = setTimeout(() => { deleteButton.classList.remove("armed"); deleteButton.textContent = "Delete"; }, 3000);
    return;
  }
  clearTimeout(deleteButton._timer);
  deleteButton.classList.remove("armed");
  deleteButton.textContent = "Delete";
  channelCommand("/delete " + currentChannel);
};

// --- The members of the current channel (zchatChannelPeople), each with a button to remove them, and the others in
// the chat, each with one to add them.
const channelPanel = document.getElementById("channel-panel");
let selfName = "";
function personRow(name, style, hash, button) {
  const row = document.createElement("div");
  row.className = "person";
  const avatar = document.createElement("span");
  avatar.className = "avatar";
  setAvatar(avatar, name, style, hash);
  const who = document.createElement("span");
  who.className = "who";
  who.textContent = name + (name === selfName ? " (you)" : "");
  who.style.color = styleColor(style);
  row.append(avatar, who);
  if (button) row.append(button);
  return row;
}
function actionButton(text, cls, line) {
  const b = document.createElement("button");
  b.textContent = text;
  b.className = cls;
  b.onclick = () => channelCommand(line);
  return b;
}
async function showChannelPanel() {
  const channel = currentChannel;
  let people = null;
  try { people = await window.zchatChannelPeople(channel); } catch {}
  channelPanel.textContent = "";
  const title = document.createElement("div");
  title.className = "title";
  title.textContent = "# " + channel;
  const close = document.createElement("button");
  close.textContent = "×";
  close.title = "Close";
  close.onclick = () => channelPanel.classList.remove("open");
  title.append(close);
  channelPanel.append(title);
  if (!people) {
    channelPanel.append(Object.assign(document.createElement("div"), { className: "note", textContent: "Not available." }));
    return;
  }
  const general = channel === "general";
  const h = document.createElement("h3");
  h.textContent = "Members (" + (people.members.length + people.away) + ")";
  channelPanel.append(h);
  for (const [name, style, hash] of people.members) {
    const button = general ? null
      : name === selfName ? actionButton("Leave", "remove", "/leave " + channel)
      : actionButton("Remove", "remove", "/remove #" + channel + " " + name);
    channelPanel.append(personRow(name, style, hash, button));
  }
  if (people.away) {
    channelPanel.append(Object.assign(document.createElement("div"), { className: "note",
      textContent: "and " + people.away + " not in the chat now" }));
  }
  if (general) {
    channelPanel.append(Object.assign(document.createElement("div"), { className: "note",
      textContent: "Everybody is always in #general." }));
    return;
  }
  const h2 = document.createElement("h3");
  h2.textContent = "Add people";
  channelPanel.append(h2);
  if (!people.others.length) {
    channelPanel.append(Object.assign(document.createElement("div"), { className: "note",
      textContent: "Everybody in the chat is in it (people with an older zchat cannot be added)." }));
  }
  for (const [name, style, hash] of people.others) {
    channelPanel.append(personRow(name, style, hash, actionButton("Add", "add", "/add #" + channel + " " + name)));
  }
}
document.getElementById("channel-members").onclick = () => {
  if (channelPanel.classList.toggle("open")) showChannelPanel();
};
setInterval(() => { if (channelPanel.classList.contains("open")) showChannelPanel(); }, 2000);
document.addEventListener("mousedown", e => {
  if (channelPanel.classList.contains("open") && !channelPanel.contains(e.target) &&
      e.target.id !== "channel-members") {
    channelPanel.classList.remove("open");
  }
});
document.addEventListener("keydown", e => { if (e.key === "Escape") channelPanel.classList.remove("open"); });
setInterval(refreshChannels, 1000);
const newChannel = document.getElementById("new-channel");
const newChannelName = document.getElementById("new-channel-name");
document.getElementById("add-channel").onclick = () => {
  newChannel.classList.toggle("open");
  if (newChannel.classList.contains("open")) { newChannelName.value = ""; newChannelName.focus(); }
};
function createChannel() {
  const name = newChannelName.value.trim().replace(/^#/, "");
  if (!name) return;
  window.zchatSend("/create " + name + " " + document.getElementById("new-channel-kind").value);
  newChannel.classList.remove("open");
  input.focus();
  setTimeout(refreshChannels, 150);
}
document.getElementById("new-channel-create").onclick = createChannel;
document.getElementById("new-channel-cancel").onclick = () => { newChannel.classList.remove("open"); input.focus(); };
newChannelName.addEventListener("keydown", e => {
  if (e.key === "Enter") { createChannel(); e.preventDefault(); }
  else if (e.key === "Escape") { newChannel.classList.remove("open"); input.focus(); e.preventDefault(); }
});

// --- Dice, in a window of its own (zchat.game("dice", state)): a real window when the web view allows one
// (window.open), or else one floating over the chat. Its buttons send the /game dice commands.
const diceStyle = `
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #111317; color: #d6d9df; font: 13px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .dice { padding: 14px; display: flex; flex-direction: column; gap: 12px; }
  .top { display: flex; align-items: baseline; gap: 8px; }
  .top .title { font-size: 18px; font-weight: 700; }
  .top .by { color: #7d8491; font-size: 12px; }
  .timer { display: flex; justify-content: space-between; align-items: baseline; }
  .timer .left { font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .timer .phase { color: #7d8491; }
  .timer .left.low { color: #e5534b; }
  .bar { height: 6px; border-radius: 3px; background: #262a33; overflow: hidden; }
  .bar div { height: 100%; background: #6ea8ff; transition: width .9s linear; }
  .bar div.low { background: #e5534b; }
  .you { background: #181b21; border: 1px solid #262a33; border-radius: 10px; padding: 12px; display: flex; align-items: center; gap: 14px; }
  .you .face { font-size: 46px; line-height: 1; width: 52px; text-align: center; }
  .you .points { font-size: 22px; font-weight: 700; }
  .you .hint { color: #7d8491; font-size: 12px; }
  .buttons { display: flex; gap: 8px; }
  .buttons button { flex: 1; height: 40px; border-radius: 8px; font: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
    border: 1px solid #262a33; background: #1e222a; color: #d6d9df; }
  .buttons button.roll { background: #6ea8ff; border-color: #6ea8ff; color: #0b0d10; }
  .buttons button.stop { border-color: #3fb950; color: #3fb950; }
  .buttons button:disabled { opacity: .35; cursor: default; }
  h3 { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .8px; color: #7d8491; margin: 0 0 6px; }
  .player { display: flex; align-items: center; gap: 8px; padding: 5px 0; border-bottom: 1px solid #1c1f26; }
  .player .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .player .name { flex: 1; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .player .status { font-size: 12px; color: #7d8491; }
  .player .pts { font-weight: 700; min-width: 3ch; text-align: right; font-variant-numeric: tabular-nums; }
  .player.win .pts { color: #f2c94c; }
  .none { color: #7d8491; font-size: 12px; }
  .result { font-size: 15px; font-weight: 700; text-align: center; padding: 6px; border-radius: 8px; background: #2a2410; color: #f2c94c; }
`;
let diceState = null, dicePopup = null, diceClosedRound = null;
// The same look for the floating window, but only inside it.
document.getElementById("dice-style").textContent = diceStyle.replace(/:root \{[^}]*\}/, "").replace(/(^|\})\s*([^{}@]+)\{/g,
  (m, end, sel) => end + " " + sel.split(",").map(x => x.trim() === "body" ? "#dice-float" : "#dice-float " + x.trim()).join(", ") + " {");
const diceFloat = document.getElementById("dice-float");
function diceDoc() {
  // The real window, while it is open; or the floating one.
  if (dicePopup && !dicePopup.closed) return dicePopup.document;
  return null;
}
function openDice(focus) {
  if (!diceDoc()) {
    let w = null;
    try { w = window.open("", "zchat-dice", "popup,width=380,height=560"); } catch {}
    if (w && w.document) {
      w.document.open();
      w.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>zchat · dice</title><style>${diceStyle}</style></head><body><div class="dice" id="dice"></div></body></html>`);
      w.document.close();
      dicePopup = w;
      // Someone else's round: back to typing in the chat.
      if (!focus) setTimeout(() => { try { window.focus(); } catch {} }, 50);
    } else {
      dicePopup = null;
      diceFloat.classList.add("open");
    }
  }
  renderDice();
}
function closeDice() {

    close.onclick = closePokemon;
    head.append(close);
  }
  v.field = el("div", "field");
  v.weather = el("div", "weather");
  v.field.append(v.weather);
  for (const pos of ["far", "near"]) {
    const p = v[pos] = {};
    p.sprite = el("div", "sprite " + pos);
    p.img = el("img");
    p.img.alt = "";
    p.img.onerror = () => {
      // The animated one, then the still one, then (offline) a placeholder.
      if (p.urls && p.stage + 1 < p.urls.length) { p.stage++; p.img.className = /\.png$/.test(p.urls[p.stage]) ? "small" : ""; p.img.src = p.urls[p.stage]; }
      else { p.stage = 99; p.img.style.display = "none"; p.ph.style.display = ""; }
    };
    p.ph = el("div", "ph");
    p.ph.style.display = "none";
    p.sprite.append(p.img, p.ph);
    p.stat = el("div", "stat " + pos);
    p.team = el("div", "teambar " + pos);
    p.conds = el("div", "conds " + pos);
    v.field.append(p.sprite, p.stat, p.team, p.conds);
  }
  v.overlay = el("div", "overlay");
  v.field.append(v.overlay);
  v.controls = el("div", "controls");
  v.bottom = el("div", "bottom");
  left.append(head, v.field, v.controls, v.bottom);
  v.log = el("div", "log");
  v.log.addEventListener("scroll", () => { v.stick = v.log.scrollHeight - v.log.scrollTop - v.log.clientHeight < 30; });
  v.stick = true;
  v.say = el("input", "say");
  v.say.placeholder = "Chat in the battle";
  v.say.maxLength = 300;
  v.say.addEventListener("keydown", e => {
    if (e.key !== "Enter") return;
    const text = v.say.value.trim();
    if (text) window.zchatSend("/game pokemon say " + text);
    v.say.value = "";
    e.preventDefault();
  });
  right.append(v.log, v.say);
  v.tip = el("div", "tip");
  root.textContent = "";
  root.append(left, right, v.tip);
  return v;
}

// A part redone only when what it shows changed.
function pkPart(v, node, key, build) {
  if (node._key === key) return;
  node._key = key;
  v.tip.style.display = "none";
  node.textContent = "";
  build(node);
}
// The hover box: lines made by make() when the mouse comes over node.
function pkTip(v, node, make) {
  const win = v.doc.defaultView;
  const place = e => {
    const r = v.tip.getBoundingClientRect();
    let x = e.clientX + 14, y = e.clientY + 14;
    if (x + r.width > win.innerWidth - 6) x = Math.max(6, e.clientX - r.width - 14);
    if (y + r.height > win.innerHeight - 6) y = Math.max(6, e.clientY - r.height - 14);
    v.tip.style.left = x + "px"; v.tip.style.top = y + "px";
  };
  node.addEventListener("mouseenter", e => {
    v.tip.textContent = "";
    v.tip.append(...make());
    v.tip.style.display = "block";
    place(e);
  });
  node.addEventListener("mousemove", place);
  node.addEventListener("mouseleave", () => { v.tip.style.display = "none"; });
}
function pkTypeBadge(v, type) {
  const b = v.el("span", "type", type);
  b.style.background = pkTypeColor(type);
  b.style.color = pkInk(pkTypeColor(type));
  return b;
}
// What is known of a Pokémon, for its hover box.
function pkMonTip(v, mon) {
  const el = v.el, out = [];
  const t = el("div", "t", mon.species + (mon.name && mon.name !== mon.species ? " (" + mon.name + ")" : "") + " L" + mon.level);
  out.push(t);
  const types = el("div", "chips");
  for (const ty of mon.tera ? [mon.tera] : mon.types || []) types.append(pkTypeBadge(v, ty));
  if (mon.tera) types.append(el("span", "d", "Terastallized"));
  else if (mon.teraType) types.append(el("span", "d", "Tera: " + mon.teraType));
  out.push(types);
  out.push(el("div", "", "HP: " + (mon.exact ? mon.hp + "/" + mon.maxhp + " (" + pkPercent(mon) + "%)" : pkPercent(mon) + "%")
    + (mon.status && mon.status !== "fnt" ? " · " + mon.status.toUpperCase() : pkFainted(mon) ? " · fainted" : "")));
  if (mon.ability) out.push(el("div", "", "Ability: " + mon.ability));
  if (mon.item) out.push(el("div", "", "Item: " + mon.item));
  const stats = Object.entries(mon.stats || {}).filter(([k]) => k !== "hp");
  if (stats.length) out.push(el("div", "d", stats.map(([k, n]) => (pkStatNames[k] || k) + " " + n).join(" / ")));
  const boosts = Object.entries(mon.boosts || {}).filter(([, n]) => n);
  if (boosts.length) out.push(el("div", "d", boosts.map(([k, n]) => (n > 0 ? "+" : "") + n + " " + (pkStatNames[k] || k)).join(", ")));
  if (mon.moves && mon.moves.length) for (const m of mon.moves) out.push(el("div", "", "• " + m));
  else if (!mon.exact) out.push(el("div", "d", "No moves seen yet"));
  return out;
}

// One side of the field: its Pokémon in, its stat bar, its team and its conditions.
function pkRenderSide(v, pos, side, color, ours, gen) {
  const el = v.el, p = v[pos];
  const team = side.team || [];
  const mon = side.active >= 0 ? team[side.active] : null;
  // The sprite, loaded again only for another Pokémon.
  const urls = mon ? pkSpriteUrls(mon.species, mon.shiny, pos === "near", gen) : null;
  const spriteKey = urls ? urls[0] : "";
  if (p.spriteKey !== spriteKey) {
    p.spriteKey = spriteKey;
    p.urls = urls;
    p.stage = 0;
    p.ph.style.display = "none";
    p.img.className = urls && /\.png$/.test(urls[0]) ? "small" : "";
    if (urls) { p.img.style.display = ""; p.img.src = urls[0]; } else { p.img.style.display = "none"; p.img.removeAttribute("src"); }
  }
  p.sprite.classList.toggle("fainted", !!mon && pkFainted(mon));
  p.sprite.classList.toggle("dmax", !!mon && !!mon.dynamaxed && !pkFainted(mon));
  pkPart(v, p.ph, mon ? JSON.stringify([mon.name, mon.types, mon.tera]) : "", node => {
    if (!mon) return;
    node.append(el("div", "n", mon.name || mon.species));
    const types = el("div", "chips");
    for (const ty of mon.tera ? [mon.tera] : mon.types || []) types.append(pkTypeBadge(v, ty));
    node.append(types);
  });
  if (!p.sprite._tipped) {
    p.sprite._tipped = true;
    pkTip(v, p.sprite, () => p.sprite._mon ? pkMonTip(v, p.sprite._mon) : []);
  }
  p.sprite._mon = mon;

  pkPart(v, p.stat, JSON.stringify([mon, ours]), node => {
    node.style.display = mon ? "" : "none";
    if (!mon) return;
    const nm = el("div", "nm");
    nm.append(el("span", "n", mon.name || mon.species));
    if (mon.gender === "M") nm.append(el("span", "m", "♂"));
    if (mon.gender === "F") nm.append(el("span", "f", "♀"));
    nm.append(el("span", "lv", "L" + mon.level));
    if (mon.tera) {
      const t = el("span", "tera", "Tera " + mon.tera);
      t.style.background = pkTypeColor(mon.tera);
      t.style.color = pkInk(pkTypeColor(mon.tera));
      nm.append(t);
    }
    node.append(nm);
    const pct = pkPercent(mon);
    const bar = el("div", "hpbar"), fill = el("div");
    fill.style.width = pct + "%";
    fill.style.background = pkHpColor(pct);
    bar.append(fill);
    node.append(bar);
    const line = el("div", "hpline");
    line.append(el("span", "", mon.exact ? mon.hp + "/" + mon.maxhp : pct + "%"));
    if (mon.status) line.append(el("span", "st " + mon.status, mon.status.toUpperCase()));
    node.append(line);
    const chips = el("div", "chips");
    for (const [k, n] of Object.entries(mon.boosts || {}))
      if (n) chips.append(el("span", "chip " + (n > 0 ? "up" : "down"), (n > 0 ? "+" : "") + n + " " + (pkStatNames[k] || k)));
    if (mon.dynamaxed) chips.append(el("span", "chip dmax", "Dynamax"));
    if (mon.mega) chips.append(el("span", "chip vol", "Mega"));
    for (const x of mon.volatiles || []) chips.append(el("span", "chip vol", x));
    if (chips.childElementCount) node.append(chips);
    pkTip(v, node, () => pkMonTip(v, mon));
  });

  pkPart(v, p.team, JSON.stringify([side.name, color, team, side.active, side.teamSize]), node => {
    const who = el("span", "who", side.name || "");
    who.style.color = color || "#fff";
    node.append(who);
    const size = Math.max(side.teamSize || 6, team.length);
    for (let i = 0; i < size; i++) {
      const m = team[i];
      const ball = el("span", "ball" + (!m ? " unknown" : pkFainted(m) ? " fnt" : "") + (m && i === side.active ? " active" : ""));
      if (m) pkTip(v, ball, () => pkMonTip(v, m));
      else ball.title = "Not seen yet";
      node.append(ball);
    }
  });
  pkPart(v, p.conds, JSON.stringify(side.conditions || []), node => {
    for (const c of side.conditions || []) node.append(el("span", "chip cond", c));
  });
}

// What we can do: our moves and switches, or what we wait for.
function pkRenderControls(v, s, player) {
  const el = v.el, rq = s.request;
  const key = JSON.stringify([s.phase, s.setup, s.watching, player, s.chosen, s.choice, s.cancelling, rq, s.error,
                              s.result]);
  pkPart(v, v.controls, key, node => {
    if (s.phase === "setup") { node.append(el("div", "wait", s.setup || "Getting ready…")); return; }
    if (s.phase === "over") {
      node.append(el("div", "wait", s.result || "The battle is over."));
      if (player) {
        const again = el("button", "btn primary", "New battle");
        again.style.width = "fit-content";
        again.onclick = () => window.zchatSend("/game pokemon");
        node.append(again);
      }
      return;
    }
    if (!player) { node.append(el("div", "wait", "Watching")); return; }
    if (s.error) node.append(el("div", "err", s.error));
    // Chosen: it can be taken back, as on Showdown, until the opponent chooses too and the turn is played.
    if (s.chosen) {
      node.append(el("div", "wait", (s.choice ? "You chose " + s.choice + ". " : "") + "Waiting for opponent…"));
      // Until the battle says whether it could: the opponent may have chosen just now.
      const cancel = el("button", "btn", s.cancelling ? "Cancelling…" : "Cancel");
      cancel.disabled = !!s.cancelling;
      cancel.style.width = "fit-content";
      cancel.title = "Take your choice back and choose again";
      cancel.onclick = () => window.zchatSend("/game pokemon cancel");
      node.append(cancel);
      return;
    }
    if (!rq) { node.append(el("div", "wait", "Waiting for opponent…")); return; }
    if (pkGimmick.rqid !== rq.rqid) pkGimmick = { rqid: rq.rqid, on: "" };
    const me = (s.sides || []).find(x => x.id === s.you) || { team: [] };
    if (rq.kind === "move") {
      node.append(el("h3", "", rq.dynamaxed ? "Max Moves" : "Attack"));
      const moves = el("div", "moves");
      // The buttons, made again when a gimmick is checked: Z-Power and Dynamax change what the moves are.
      const fill = () => {
        moves.textContent = "";
        v.tip.style.display = "none";
        const on = rq.dynamaxed ? "" : pkGimmick.on;
        for (const m of rq.moves || []) {
          const shown = rq.dynamaxed || on === "max" ? m.maxMove || m : on === "z" ? m.zmove || m : m;
          const b = el("button", "mv");
          const c = pkTypeColor(shown.type);
          b.style.background = c;
          b.style.color = pkInk(c);
          b.disabled = !!m.disabled || m.pp === 0 || (on === "z" && !m.zmove);
          b.append(el("span", "n", shown.name));
          const sub = el("span", "sub");
          // No PP (null) for the only thing left to do: Recharge, a locked Outrage, Struggle, Gen 1's sleepy "Fight".
          sub.append(el("span", "", (shown.type || "") + (shown !== m && shown.basePower ? " · " + shown.basePower : "")),
                     el("span", "", m.pp === null ? "" : "PP " + m.pp + "/" + m.maxpp));
          b.append(sub);
          b.onclick = () => window.zchatSend("/game pokemon move " + m.slot + (on ? " " + pkGimmickWords[on] : ""));
          pkTip(v, b, () => {
            const head = el("div", "chips");
            head.append(pkTypeBadge(v, shown.type), el("span", "", shown.category));
            const out = [el("div", "t", shown.name), head,
              el("div", "", "Power: " + (shown.basePower ? shown.basePower : "—") + " · Accuracy: " + (shown.accuracy === true || !shown.accuracy ? "—" : shown.accuracy + "%"))];
            if (shown.desc) out.push(el("div", "d", shown.desc));
            const what = rq.dynamaxed ? "Max Move, from " + m.name + "."
              : on === "max" ? "Dynamaxes, then uses " + shown.name + " (from " + m.name + ")."
              : on === "z" ? (m.zmove ? "Uses the Z-Power: " + shown.name + " (from " + m.name + "), once per battle." : "No Z-Move from " + m.name + ".")
              : on === "mega" ? "Mega Evolves, then uses " + m.name + "."
              : on === "ultra" ? "Ultra Bursts, then uses " + m.name + "."
              : on === "tera" ? "Terastallizes into " + rq.canTera + ", then uses " + m.name + "." : "";
            if (what) out.push(el("div", "", what));
            if (m.disabled) out.push(el("div", "err", "Disabled"));
            return out;
          });
          moves.append(b);
        }
      };
      fill();
      node.append(moves);
      // The gimmicks this choice can use, one at most.
      const hasZ = (rq.moves || []).some(m => m.zmove);
      const gimmicks = [["tera", !!rq.canTera, "Terastallize "], ["mega", !!rq.canMega, "Mega Evolve"],
        ["ultra", !!rq.canUltraBurst, "Ultra Burst"], ["z", hasZ, "Z-Power"], ["max", !!rq.canDynamax, "Dynamax"]]
        .filter(([, can]) => can && !rq.dynamaxed);
      if (gimmicks.length) {
        const row = el("div", "gimmicks");
        const boxes = [];
        for (const [word, , label] of gimmicks) {
          const lab = el("label", "teracheck");
          const box = el("input");
          box.type = "checkbox";
          box.checked = pkGimmick.on === word;
          box.onchange = () => {
            pkGimmick.on = box.checked ? word : "";
            for (const [w, other] of boxes) other.checked = pkGimmick.on === w;
            fill();
          };
          boxes.push([word, box]);
          lab.append(box, el("span", "", label));
          if (word === "tera") lab.append(pkTypeBadge(v, rq.canTera));
          row.append(lab);
        }
        node.append(row);
      }
      node.append(el("h3", "", rq.trapped ? "Switch (trapped)" : "Switch"));
    } else {
      node.append(el("h3", "", "Choose a Pokémon to send in"));
    }
    const row = el("div", "switches");
    for (const w of rq.switches || []) {
      const b = el("button", "sw" + (w.active ? " active" : ""));
      // Revival Blessing brings back a fainted one: only those can be picked.
      b.disabled = (rq.reviving ? !w.fainted : !!w.fainted) || !!w.active || (!!rq.trapped && rq.kind === "move");
      const img = el("img");
      img.alt = "";
      img.onerror = () => { img.style.visibility = "hidden"; };
      img.src = pkSpriteUrls(w.species, false, false)[1];
      const hp = el("span", "hp");
      const pct = w.fainted ? 0 : pkPercent(w);
      hp.append(el("span", "", w.fainted ? "fainted" : pct + "%"));
      if (w.status && w.status !== "fnt") hp.append(el("span", "st " + w.status, w.status.toUpperCase()));
      b.append(img, el("span", "n", w.name), hp);
      b.onclick = () => window.zchatSend("/game pokemon switch " + w.slot);
      const mon = (me.team || [])[w.slot - 1];
      pkTip(v, b, () => mon ? pkMonTip(v, mon) : [el("div", "t", w.name), el("div", "", w.hp + "/" + w.maxhp)]);
      row.append(b);
    }
    node.append(row);
  });

  // The timer and forfeiting, for the players; only the seconds change every second.
  const playing = player && s.phase !== "over";
  const timer = s.timer || {};
  pkPart(v, v.bottom, JSON.stringify([playing, !!timer.on]), node => {
    node.style.display = playing ? "" : "none";
    if (!playing) return;
    const t = el("button", "btn" + (timer.on ? " on" : ""), timer.on ? "Timer: on" : "Timer");
    t.title = timer.on ? "Stop the timer" : "Start the timer: each choice has to be made in time";
    t.onclick = () => window.zchatSend("/game pokemon timer");
    v.left = el("span", "left-s");
    const forfeit = el("button", "btn danger", "Forfeit");
    forfeit.onclick = () => { if (v.doc.defaultView.confirm("Forfeit the battle?")) window.zchatSend("/game pokemon forfeit"); };
    node.append(t, v.left, el("span", "grow"), forfeit);
  });
  if (playing && v.left) {
    const left = timer.left;
    v.left.textContent = left === null || left === undefined ? "" : "⏱ " + left + "s";
    v.left.classList.toggle("low", left !== null && left !== undefined && left <= 30);
  }
}

// The log: only the new lines are added, unless it is another battle or it got shorter.
function pkRenderLog(v, s) {
  const el = v.el, lines = s.log || [];
  if (v.log._battle !== s.battle || lines.length < (v.log._count || 0)) {
    v.log.textContent = "";
    v.log._battle = s.battle;
    v.log._count = 0;
    v.stick = true;
  }
  if (lines.length === v.log._count) return;
  const stick = v.stick;
  for (let i = v.log._count; i < lines.length; i++) {
    const l = lines[i];
    const div = el("div", l.k);
    if (l.k === "chat") {
      const who = el("span", "who", l.n || "");
      if (l.c) who.style.color = l.c;
      div.append(who, v.doc.createTextNode(": " + (l.t || "")));
    } else {
      div.textContent = l.t || "";
    }
    v.log.append(div);
  }
  v.log._count = lines.length;
  if (stick) v.log.scrollTop = v.log.scrollHeight;
}

function renderPokemon() {
  const s = pkState;
  const popup = !!pkDoc();
  const doc = popup ? pkDoc() : document;
  const root = popup ? doc.getElementById("pk") : document.getElementById("pk-body");
  if (!s || !root || (!popup && !pkFloat.classList.contains("open"))) return;
  if (!root._pk) root._pk = pkBuild(doc, root, popup);
  const v = root._pk;
  const player = !s.watching && (s.you === "p1" || s.you === "p2");
  const title = (s.title || "Pokémon battle") + (s.format ? " · " + s.format : "");
  if (popup) doc.title = s.title ? title : "zchat · Pokémon";
  v.title.textContent = title;
  v.turn.textContent = s.phase === "battle" && s.turn ? "Turn " + s.turn : s.watching ? "watching" : "";

  // Our side near, at the bottom; for a spectator, p1.
  const sides = s.sides || [];
  const nearIndex = s.you === "p2" ? 1 : 0;
  const colors = s.colors || {};
  for (const [pos, i] of [["near", nearIndex], ["far", 1 - nearIndex]]) {
    const side = sides[i] || { id: "p" + (i + 1), team: [], active: -1, conditions: [], teamSize: 6 };
    pkRenderSide(v, pos, side, colors[side.id || "p" + (i + 1)], player && i === nearIndex, s.gen);
  }
  const f = s.field || {};
  const weather = (f.weather || "").toLowerCase();
  v.field.className = "field" + (/rain/.test(weather) ? " rain" : /sand/.test(weather) ? " sand" : /sun/.test(weather) ? " sun"
    : /snow|hail/.test(weather) ? " snow" : "");
  pkPart(v, v.weather, JSON.stringify(f), node => {
    for (const x of [f.weather, f.terrain, ...(f.other || [])]) if (x) node.append(v.el("span", "", x));
  });
  pkPart(v, v.overlay, JSON.stringify([s.phase, s.setup, s.result]), node => {
    if (s.phase === "setup") node.append(v.el("div", "", s.setup || "Getting ready…"));
    else if (s.phase === "over" && s.result) node.append(v.el("div", "result", s.result));
  });
  pkRenderControls(v, s, player);
  pkRenderLog(v, s);
}
function pokemonGame(state) {
  const fresh = !pkState || pkState.battle !== state.battle;
  pkState = state;
  document.getElementById("pk-open").hidden = false;
  // A new battle opens it, unless it was closed during this one.
  if (fresh && state.phase !== "over" && pkClosedBattle !== state.battle) {
    openPokemon(true);
  } else {
    renderPokemon();
  }
}
document.getElementById("pk-open").onclick = () => { pkClosedBattle = null; openPokemon(true); };
document.getElementById("pk-float-close").onclick = closePokemon;
(() => {
  const handle = document.getElementById("pk-float-title");
  let dx = 0, dy = 0, dragging = false;
  handle.addEventListener("mousedown", e => {
    if (e.target !== handle) return;
    dragging = true;
    const r = pkFloat.getBoundingClientRect();
    dx = e.clientX - r.left; dy = e.clientY - r.top;
    e.preventDefault();
  });
  document.addEventListener("mousemove", e => {
    if (!dragging) return;
    pkFloat.style.left = Math.max(0, e.clientX - dx) + "px";
    pkFloat.style.top = Math.max(0, e.clientY - dy) + "px";
    pkFloat.style.right = "auto";
  });
  document.addEventListener("mouseup", () => { dragging = false; });
})();

// --- Pokémon challenges to us, waiting for an answer (zchat.game("pokemon-challenge", {challenges: [...]})): a card
// each over the chat, with buttons for /game pokemon accept and decline, and the seconds left to answer.
const challengesBox = document.getElementById("pk-challenges");
let challengeTimer = null;
function pokemonChallenges(state) {
  challengesBox.textContent = "";
  clearInterval(challengeTimer);
  const list = state.challenges || [];
  const since = Date.now();
  const lefts = [];
  for (const c of list) {
    const card = document.createElement("div");
    card.className = "challenge";
    const what = document.createElement("div");
    what.className = "what";
    const name = document.createElement("b");

    name.style.color = c.color;
    const sub = document.createElement("span");
    sub.className = "sub";
    sub.textContent = "Pokémon Showdown · " + (c.format || "Gen 9 Random Battle");
    const ball = document.getElementById("pk-challenge-open").querySelector("svg.pokeball").cloneNode(true);
    what.append(ball, " ", name, " challenges you to a Pokémon battle!", sub);
    const row = document.createElement("div");
    row.className = "row";
    const answer = command => {
      card.remove();
      window.zchatSend(`/game pokemon ${command} ${c.name}`);
      input.focus();
    };
    const accept = document.createElement("button");

  const me = document.getElementById("me");
  setAvatar(me.querySelector(".avatar"), name, style, selfAvatar);
  if (profile.classList.contains("open")) showProfilePreview();
  const label = me.querySelector(".name");
  label.textContent = name;
  label.title = name;
  label.style.color = styleColor(style);
}
// --- Changing our name and color, by clicking them: sent as /nick and /color, like typing them.
const profile = document.getElementById("profile");
const profileName = document.getElementById("profile-name");
const profileColor = document.getElementById("profile-color");
let current = { name: "", color: "" };
function toHex(rgb) {
  const m = /rgb\((\d+),\s*(\d+),\s*(\d+)\)/.exec(rgb || "");
  return m ? "#" + m.slice(1).map(n => (+n).toString(16).padStart(2, "0")).join("") : "#888888";
}
function showProfilePreview() {
  const name = profileName.value.trim() || current.name;
  paintAvatar(profile.querySelector(".preview .avatar"), name, profileColor.value, selfAvatar);
  const label = profile.querySelector(".preview .name");
  label.textContent = name;
  label.style.color = profileColor.value;
  document.getElementById("profile-hex").textContent = profileColor.value;
}
const swatches = ["#e63232", "#ff8800", "#f2c94c", "#3fb950", "#2ec4b6", "#4d8dff", "#9b5de5", "#f15bb5",
                  "#ff6b6b", "#ffb86b", "#c3e88d", "#7ee787", "#89ddff", "#a5b4fc", "#d4a5ff", "#ffffff"];
for (const color of swatches) {
  const swatch = document.createElement("span");
  swatch.style.background = color;
  swatch.title = color;
  swatch.onclick = () => { profileColor.value = color; showProfilePreview(); };
  document.getElementById("profile-swatches").appendChild(swatch);
}
function openProfile() {
  const me = document.getElementById("me");
  current = { name: me.querySelector(".name").textContent, color: toHex(me.querySelector(".name").style.color) };
  profileName.value = current.name;
  profileColor.value = current.color;
  showProfilePreview();
  profile.classList.add("open");
  profileName.focus();
  profileName.select();
}
function closeProfile() {
  profile.classList.remove("open");
  input.focus();
}
function saveProfile() {
  const name = profileName.value.trim();
  if (name && name !== current.name) window.zchatSend("/nick " + name);
  if (profileColor.value.toLowerCase() !== current.color.toLowerCase()) window.zchatSend("/color " + profileColor.value);
  closeProfile();
  setTimeout(refreshSelf, 150);
}
document.getElementById("me").onclick = () => profile.classList.contains("open") ? closeProfile() : openProfile();
profileName.oninput = showProfilePreview;
profileColor.oninput = showProfilePreview;
document.getElementById("profile-random").onclick = () => {
  // Any hue, bright enough to read on the dark background.
  const h = Math.random() * 360, s = 0.75, l = 0.6;
  const f = n => { const k = (n + h / 30) % 12; return Math.round(255 * (l - s * Math.min(l, 1 - l) * Math.max(-1, Math.min(k - 3, 9 - k, 1)))); };
  profileColor.value = "#" + [f(0), f(8), f(4)].map(v => v.toString(16).padStart(2, "0")).join("");
  showProfilePreview();
};
// A file chosen is saved where zchat can read it (like a dropped one), then set with /avatar.
const profileNote = document.getElementById("profile-note");
function afterAvatarChange() {
  // Made into an avatar by zchat, which takes a moment for a big GIF.
  for (const ms of [200, 700, 1500, 3000]) setTimeout(refreshSelf, ms);
}
document.getElementById("profile-upload").onclick = () => document.getElementById("profile-file").click();
document.getElementById("profile-file").onchange = e => {
  const file = e.target.files[0];
  e.target.value = "";
  if (!file) return;
  profileNote.textContent = "Setting " + file.name + "…";
  const reader = new FileReader();
  reader.onload = async () => {
    const base64 = String(reader.result).replace(/^data:[^,]*,/, "");
    let path = null;
    try { path = await window.zchatDrop(file.name, base64); } catch {}
    if (!path) { profileNote.textContent = "Could not read " + file.name + "."; return; }
    window.zchatSend('/avatar "' + path + '"');
    profileNote.textContent = "Everybody sees it; a GIF plays. It changes right away.";
    afterAvatarChange();
  };
  reader.readAsDataURL(file);
};
document.getElementById("profile-remove").onclick = () => {
  window.zchatSend("/avatar none");
  afterAvatarChange();
};
document.getElementById("profile-save").onclick = saveProfile;
document.getElementById("profile-cancel").onclick = closeProfile;
profile.addEventListener("keydown", e => {
  if (e.key === "Enter") { saveProfile(); e.preventDefault(); }
  else if (e.key === "Escape") { closeProfile(); e.preventDefault(); e.stopPropagation(); }
});
document.addEventListener("mousedown", e => {
  if (profile.classList.contains("open") && !profile.contains(e.target) && !document.getElementById("me").contains(e.target)) {
    closeProfile();
  }
});

let peopleShown = "";
async function refreshPeople() {
  refreshSelf();
  const people = (await mentions()).filter(([name]) => name !== "everyone");
  const box = document.getElementById("people");
  // Rebuilt only when it changes, so avatars that play keep playing.
  const shown = JSON.stringify(people);
  if (shown === peopleShown) {
    // Avatars that were not here yet.
    [...box.children].forEach((item, i) => setAvatar(item.firstChild, ...people[i]));
    return;
  }
  peopleShown = shown;
  box.textContent = "";
  for (const [name, style, hash] of people) {
    const item = document.createElement("div");
    item.className = "item";
    const avatar = document.createElement("span");
    avatar.className = "avatar";
    setAvatar(avatar, name, style, hash);
    const label = document.createElement("span");
    label.textContent = name;
    label.style.color = styleColor(style);
    item.append(avatar, label);
    box.appendChild(item);
  }
}
setInterval(refreshPeople, 2000);

// --- Input: Enter sends, Up/Down go through what was sent, '@' opens the list of people.
const sent = [];
let sentPos = 0, draft = "";
let list = [], selected = 0, atStart = -1;

function closeMentions() { mentionsBox.style.display = "none"; atStart = -1; list = []; }
async function updateMentions() {
  const caret = input.selectionStart;
  const before = input.value.slice(0, caret);
  const at = before.lastIndexOf("@");
  if (at < 0 || (at > 0 && /\w/.test(before[at - 1])) || /\s/.test(before.slice(at + 1))) {
    closeMentions();
    return;
  }
  const typed = before.slice(at + 1).toLowerCase();
  const people = await mentions();
  list = people.filter(([name]) => name.toLowerCase().startsWith(typed));
  if (!list.length) { closeMentions(); return; }
  atStart = at;
  selected = Math.min(selected, list.length - 1);
  mentionsBox.textContent = "";
  list.forEach(([name, style, hash], i) => {
    const d = document.createElement("div");
    const avatar = document.createElement("span");
    avatar.className = "avatar";
    setAvatar(avatar, name, style, hash);
    const label = document.createElement("span");
    label.textContent = "@" + name;
    d.append(avatar, label);
    d.style.color = styleColor(style);
    if (i === selected) d.className = "selected";
    d.onmousedown = e => { e.preventDefault(); acceptMention(i); };
    mentionsBox.appendChild(d);
  });
  mentionsBox.style.display = "block";
}
function acceptMention(i) {
  const [name] = list[i];
  const caret = input.selectionStart;
  input.value = input.value.slice(0, atStart) + "@" + name + " " + input.value.slice(caret);
  const pos = atStart + name.length + 2;
  input.setSelectionRange(pos, pos);
  closeMentions();
}

input.addEventListener("keydown", e => {
  if (mentionsBox.style.display === "block") {
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      selected = (selected + (e.key === "ArrowDown" ? 1 : list.length - 1)) % list.length;
      updateMentions();
      e.preventDefault();
      return;
    }
    if (e.key === "Tab" || e.key === "Enter") { acceptMention(selected); e.preventDefault(); return; }
    if (e.key === "Escape") { closeMentions(); e.preventDefault(); return; }
  }
  if (e.key === "Enter") {
    const line = input.value;
    input.value = "";
    if (line.trim() && sent[sent.length - 1] !== line) sent.push(line);
    sentPos = sent.length;
    draft = "";
    // A game's command typed here: its answer is in the games log, so that is shown. (The games' own buttons do not
    // move the chat.)
    if (/^\/(game|casino|coins|shop)(\s|$)/i.test(line.trim()) && currentChannel !== gamesLog &&
        channelList.some(c => c[0] === gamesLog)) {
      channelCommand("/join " + gamesLog);
    }
    window.zchatSend(line);
    // A new name or color (/nick, /color) shows right away.
    setTimeout(refreshSelf, 150);
    e.preventDefault();
  } else if (e.key === "ArrowUp" && sentPos > 0) {
    if (sentPos === sent.length) draft = input.value;
    input.value = sent[--sentPos];
    e.preventDefault();
  } else if (e.key === "ArrowDown" && sentPos < sent.length) {
    input.value = ++sentPos === sent.length ? draft : sent[sentPos];
    e.preventDefault();
  }
});
input.addEventListener("input", async e => {
  selected = 0;
  updateMentions();
  // A pasted path of an image becomes the /image command for it, like a file dropped on a terminal.
  if (e.inputType === "insertFromPaste") {
    try {
      const rewritten = await window.zchatRewrite(input.value);
      if (rewritten) input.value = rewritten;
    } catch {}
  }
});
input.addEventListener("blur", () => setTimeout(closeMentions, 150));
// Typing anywhere types in the input box, except in another field (like the name in the profile panel) and in the
// floating bomber and arena windows, whose keys play.
document.addEventListener("keydown", e => {
  const el = document.activeElement;
  if (bmFloat.contains(el) || amFloat.contains(el)) return;
  const field = el && el !== input && (el.matches("input, textarea, select") || el.isContentEditable);
  if (el !== input && !field && !e.ctrlKey && !e.metaKey && e.key.length === 1) input.focus();
});

// --- Dropping a file: saved where zchat can read it, then the command sending it is typed: /image for a picture,
// /file for anything else.
let dragDepth = 0;
window.addEventListener("dragenter", e => { e.preventDefault(); dragDepth++; document.body.classList.add("dragging"); });
window.addEventListener("dragleave", () => { if (--dragDepth <= 0) { dragDepth = 0; document.body.classList.remove("dragging"); } });
window.addEventListener("dragover", e => e.preventDefault());
// The command for the file at path, in the input box.
async function typeDropped(path) {
  const quoted = /\s/.test(path) ? '"' + path + '"' : path;
  input.value = (await window.zchatRewrite(quoted)) || "/file " + quoted;
  input.focus();
}
window.addEventListener("drop", e => {
  e.preventDefault();
  dragDepth = 0;
  document.body.classList.remove("dragging");
  const file = e.dataTransfer.files[0];
  if (!file) {
    // WebKitGTK (on Linux) gives the page no file, but zchat has its path.
    (async () => { try { const path = await window.zchatDroppedFile(); if (path) await typeDropped(path); } catch {} })();
    return;
  }
  if (file.size > 34 * 1024 * 1024) { zchat.print("That file is too big to send."); return; }
  const reader = new FileReader();
  reader.onload = async () => {
    const base64 = String(reader.result).replace(/^data:[^,]*,/, "");
    try {
      const path = await window.zchatDrop(file.name, base64);
      if (path) await typeDropped(path);
    } catch {}
  };
  reader.readAsDataURL(file);
});

input.focus();
(async () => {
  try {
    const [size, font] = await window.zchatSettings();
    if (+size) settings.size = +size;
    if (font) { settings.font = font; fontSelect.value = font; }
    applySettings();
  } catch {}
  window.zchatReady();
  refreshPeople();
})();
</script>
