<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>zchat</title>
<style>
  :root {
    --bg: #111317;
    --panel: #181b21;
    --border: #262a33;
    --text: #d6d9df;
    --muted: #7d8491;
    --accent: #6ea8ff;
    --input: #1e222a;
    --size: 14px;
    --font: "Cascadia Mono", "Cascadia Code", Consolas, Menlo, "DejaVu Sans Mono", "Liberation Mono", monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 13px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: grid; grid-template-columns: 210px 1fr; grid-template-rows: 44px 1fr; overflow: hidden;
  }
  header {
    grid-column: 1 / 3; display: flex; align-items: center; gap: 10px; padding: 0 12px;
    background: var(--panel); border-bottom: 1px solid var(--border);
  }
  header .title { font-weight: 600; font-size: 15px; letter-spacing: .3px; }
  header .channel { color: var(--muted); }
  header .spacer { flex: 1; }
  header button, header select {
    background: var(--input); color: var(--text); border: 1px solid var(--border); border-radius: 6px;
    height: 28px; padding: 0 8px; font: inherit; cursor: pointer;
  }
  header button:hover, header select:hover { border-color: var(--accent); }
  aside {
    background: var(--panel); border-right: 1px solid var(--border); overflow-y: auto; padding: 10px 0;
  }
  aside h2 {
    font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .8px; color: var(--muted);
    margin: 10px 14px 6px;
  }
  aside .item {
    display: flex; align-items: center; gap: 8px; padding: 4px 14px; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis;
  }
  aside .item.active { background: #232833; }
  /* Channels: clicked to join; private ones have a lock, those with something new a dot. */
  aside h2 { display: flex; align-items: center; }
  aside h2 .add {
    margin-left: auto; width: 20px; height: 20px; border-radius: 5px; border: 1px solid var(--border);
    background: var(--input); color: var(--text); cursor: pointer; font-size: 14px; line-height: 16px; padding: 0;
  }
  aside h2 .add:hover { border-color: var(--accent); }
  #channels .item { cursor: pointer; border-radius: 0; }
  #channels .item:hover { background: #20242d; }
  #channels .item.active { background: #232833; color: #fff; font-weight: 600; }
  #channels .item.away { color: var(--muted); }
  #channels .lock { font-size: 11px; opacity: .8; }
  #channels .dot { margin-left: auto; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
  /* Buttons on a channel in the list: join one we are not in, leave one we are (shown on hover). */
  #channels .item .act {
    margin-left: auto; flex: none; height: 20px; padding: 0 8px; border-radius: 10px; font: inherit; font-size: 11px;
    cursor: pointer; border: 1px solid var(--border); background: var(--input); color: var(--text);
  }
  #channels .item .act.join { border-color: var(--accent); color: var(--accent); }
  #channels .item .act.leave { display: none; width: 20px; padding: 0; border-radius: 50%; }
  #channels .item:hover .act.leave { display: block; }
  #channels .item:hover .dot { display: none; }
  #channels .item .act:hover { background: var(--accent); border-color: var(--accent); color: #0b0d10; }
  /* The current channel's buttons, in the header. */
  header .channel-actions { display: flex; gap: 6px; }
  header .channel-actions button[hidden] { display: none; }
  header button.danger:hover { border-color: #e5534b; color: #e5534b; }
  header button.armed { background: #e5534b; border-color: #e5534b; color: #fff; }
  /* Who is in the current channel, and who can be added. */
  #channel-panel {
    position: fixed; top: 50px; left: 222px; width: 300px; max-height: calc(100vh - 70px); overflow-y: auto;
    z-index: 15; display: none; background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px; box-shadow: 0 8px 28px #000a;
  }
  #channel-panel.open { display: block; }
  #channel-panel .title { display: flex; align-items: center; font-weight: 600; font-size: 14px; margin-bottom: 8px; }
  #channel-panel .title button { margin-left: auto; }
  #channel-panel h3 {
    font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .8px; color: var(--muted);
    margin: 12px 0 6px;
  }
  #channel-panel .person { display: flex; align-items: center; gap: 8px; padding: 4px 0; }
  #channel-panel .person .who { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #channel-panel .note { color: var(--muted); font-size: 12px; padding: 4px 0; }
  #channel-panel button {
    background: var(--input); color: var(--text); border: 1px solid var(--border); border-radius: 6px;
    height: 26px; padding: 0 10px; font: inherit; font-size: 12px; cursor: pointer;
  }
  #channel-panel button:hover { border-color: var(--accent); }
  #channel-panel button.add { border-color: var(--accent); color: var(--accent); }
  #channel-panel button.remove:hover { border-color: #e5534b; color: #e5534b; }
  #new-channel { display: none; margin: 4px 14px 8px; }
  #new-channel.open { display: block; }
  #new-channel input, #new-channel select {
    width: 100%; background: var(--input); color: var(--text); border: 1px solid var(--border); border-radius: 6px;
    padding: 6px 8px; font: inherit; outline: none; margin-bottom: 6px;
  }
  #new-channel input:focus { border-color: var(--accent); }
  #new-channel .row { display: flex; gap: 6px; }
  #new-channel button {
    flex: 1; background: var(--input); color: var(--text); border: 1px solid var(--border); border-radius: 6px;
    height: 28px; font: inherit; cursor: pointer;
  }
  #new-channel button.primary { background: var(--accent); border-color: var(--accent); color: #0b0d10; font-weight: 600; }
  .avatar {
    flex: none; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center;
    font-size: 11px; font-weight: 700; color: #111;
  }
  /* Who we are, above the channels. */
  #me {
    display: flex; align-items: center; gap: 10px; margin: 0 8px 6px; padding: 8px 8px 12px;
    border-bottom: 1px solid var(--border); min-width: 0;
  }
  #me { cursor: pointer; border-radius: 8px 8px 0 0; }
  #me:hover { background: #20242d; }
  #me .avatar { width: 34px; height: 34px; font-size: 15px; }
  #me .who { min-width: 0; }
  #me .name { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #me .status { color: var(--muted); font-size: 11px; }
  #me .status::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    background: #3fb950; margin-right: 5px; vertical-align: 1px; }
  /* An avatar picture fills its circle, cropped to it. */
  .avatar { overflow: hidden; }
  .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  #mentions div { display: flex; align-items: center; gap: 8px; }
  #mentions .avatar { width: 18px; height: 18px; font-size: 10px; }
  #profile .preview .avatar { width: 48px; height: 48px; font-size: 20px; }
  #profile .avatar-row { display: flex; gap: 8px; margin-bottom: 4px; }
  #profile .note { color: var(--muted); font-size: 11px; margin-bottom: 12px; min-height: 14px; }
  main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  #log {
    flex: 1; overflow-y: auto; padding: 10px 14px; font-family: var(--font); font-size: var(--size);
    line-height: 1.35;
  }
  #log .line { white-space: pre-wrap; overflow-wrap: anywhere; }
  /* Pictures and the paint canvas: characters touching, like in a terminal. */
  #log .block { white-space: pre; line-height: 1; overflow-x: auto; overflow-y: hidden; padding-bottom: 2px; }
  #log .file { display: flex; align-items: center; gap: 10px; margin: 4px 0 6px 6ch; padding: 8px 12px;
    width: fit-content; max-width: calc(100% - 6ch); box-sizing: border-box; border: 1px solid var(--border);
    border-radius: 8px; }
  #log .file .name { font-weight: 600; overflow-wrap: anywhere; }
  #log .file .size { opacity: 0.6; white-space: nowrap; }
  #log .file button { font: inherit; padding: 2px 10px; cursor: pointer; border-radius: 6px;
    border: 1px solid var(--border); background: transparent; color: inherit; }
  #log .file button:hover { border-color: var(--accent); }
  #log .picture img {
    display: block; margin: 4px 0 6px 6ch; max-width: min(100% - 6ch, 480px); height: auto; max-height: 480px;
    object-fit: contain; border-radius: 6px; cursor: zoom-in; background: #000;
  }
  #viewer {
    position: fixed; inset: 0; display: none; place-items: center; background: #000c; z-index: 20; cursor: zoom-out;
  }
  /* As big as the window allows, even for a small picture. */
  #viewer img { height: 88vh; width: auto; max-width: 92vw; object-fit: contain; border-radius: 6px; }
  #inputbar { position: relative; padding: 10px 14px 14px; border-top: 1px solid var(--border); }
  #input {
    width: 100%; background: var(--input); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 12px; font-family: var(--font); font-size: var(--size); outline: none;
  }
  #input:focus { border-color: var(--accent); }
  /* Changing our name and color: opened by clicking them, above the channels. */
  #profile {
    position: fixed; top: 112px; left: 8px; width: 264px; z-index: 15; display: none;
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 12px;
    box-shadow: 0 8px 28px #000a;
  }
  #profile.open { display: block; }
  #profile label { display: block; color: var(--muted); font-size: 11px; font-weight: 600; text-transform: uppercase;
    letter-spacing: .8px; margin: 2px 0 6px; }
  #profile input[type=text] {
    width: 100%; background: var(--input); color: var(--text); border: 1px solid var(--border); border-radius: 6px;
    padding: 7px 9px; font: inherit; font-size: 13px; outline: none; margin-bottom: 12px;
  }
  #profile input[type=text]:focus { border-color: var(--accent); }
  #profile .colors { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  #profile input[type=color] {
    width: 44px; height: 32px; padding: 0; border: 1px solid var(--border); border-radius: 6px; background: none;
    cursor: pointer;
  }
  #profile .hex { font-family: var(--font); color: var(--muted); flex: 1; }
  #profile .swatches { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; margin-bottom: 12px; }
  #profile .swatches span { height: 22px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; }
  #profile .swatches span:hover { border-color: var(--text); }
  #profile .preview { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; font-weight: 600; }
  #profile .buttons { display: flex; gap: 8px; justify-content: flex-end; }
  #profile button {
    background: var(--input); color: var(--text); border: 1px solid var(--border); border-radius: 6px;
    height: 30px; padding: 0 12px; font: inherit; cursor: pointer;
  }
  #profile button:hover { border-color: var(--accent); }
  #profile button.primary { background: var(--accent); border-color: var(--accent); color: #0b0d10; font-weight: 600; }
  #mentions {
    position: absolute; left: 14px; bottom: 58px; min-width: 220px; max-height: 240px; overflow-y: auto;
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 4px 0;
    box-shadow: 0 6px 20px #0008; display: none; font-family: var(--font); font-size: var(--size);
  }
  #mentions div { padding: 4px 12px; cursor: pointer; }
  #mentions div.selected { background: #2a3140; }
  #drop {
    position: fixed; inset: 0; display: none; place-items: center; background: #0b0d10cc;
    border: 3px dashed var(--accent); font-size: 20px; color: var(--accent); z-index: 10;
  }
  body.dragging #drop { display: grid; }
</style>
</head>
<body>
<header>
  <span class="title">zchat</span>
  <span class="channel" id="channel"></span>
  <span class="channel-actions">
    <button id="channel-members" title="Who is in this channel; add or remove people">Members</button>
    <button id="channel-leave" class="danger" title="Leave this channel" hidden>Leave</button>
    <button id="channel-delete" class="danger" title="Delete this channel, for everybody" hidden>Delete</button>
  </span>
  <span class="spacer"></span>
  <select id="font" title="Font"></select>
  <button id="smaller" title="Smaller text">A−</button>
  <button id="bigger" title="Bigger text">A+</button>
</header>
<aside>
  <div id="me" title="Change your name and color"><span class="avatar"></span>
    <div class="who"><div class="name"></div><div class="status">online</div></div></div>
  <h2>Channels <button class="add" id="add-channel" title="New channel">+</button></h2>
  <div id="new-channel">
    <input type="text" id="new-channel-name" placeholder="name" maxlength="32" autocomplete="off" spellcheck="false">
    <select id="new-channel-kind">
      <option value="public">Public: anybody can join</option>
      <option value="private">Private: only who you add</option>
    </select>
    <div class="row"><button id="new-channel-cancel">Cancel</button><button class="primary" id="new-channel-create">Create</button></div>
  </div>
  <div id="channels"></div>
  <h2>People</h2>
  <div id="people"></div>
</aside>
<main>
  <div id="log"></div>
  <div id="inputbar">
    <div id="mentions"></div>
    <input id="input" autocomplete="off" spellcheck="false" placeholder="Type a message, or /help for commands">
  </div>
</main>
<div id="profile">
  <div class="preview"><span class="avatar"></span><span class="name"></span></div>
  <label for="profile-name">Name</label>
  <input type="text" id="profile-name" maxlength="48" autocomplete="off" spellcheck="false">
  <label for="profile-color">Color</label>
  <div class="colors">
    <input type="color" id="profile-color">
    <span class="hex" id="profile-hex"></span>
    <button id="profile-random" title="Pick a random bright color">Random</button>
  </div>
  <div class="swatches" id="profile-swatches"></div>
  <label>Avatar</label>
  <div class="avatar-row">
    <button id="profile-upload">Upload image…</button>
    <button id="profile-remove">Remove</button>
    <input type="file" id="profile-file" accept="image/*" hidden>
  </div>
  <div class="note" id="profile-note">Everybody sees it; a GIF plays. It changes right away.</div>
  <div class="buttons"><button id="profile-cancel">Cancel</button><button class="primary" id="profile-save">Save</button></div>
</div>
<div id="channel-panel"></div>
<div id="drop">Drop a picture or a file to send it</div>
<div id="viewer"><img alt="picture"></div>
<script>
"use strict";
// The C++ side calls zchat.print(), zchat.bell(), zchat.sound() and zchat.info(); it is called through the functions it binds:
// zchatReady(), zchatSend(line), zchatMentions(), zchatSelf(), zchatAvatar(hash), zchatChannels(), zchatChannelPeople(channel), zchatRewrite(line), zchatDrop(name, base64), zchatSettings()
// and zchatSaveSettings(size, font).
const log = document.getElementById("log");
const input = document.getElementById("input");
const mentionsBox = document.getElementById("mentions");

// --- Settings: text size and font, remembered in zchat's config file (zchatSettings / zchatSaveSettings).
const fonts = [
  ["Default", "var(--font)"], ["Cascadia Mono", '"Cascadia Mono"'], ["Consolas", "Consolas"], ["Menlo", "Menlo"],
  ["DejaVu Sans Mono", '"DejaVu Sans Mono"'], ["Courier New", '"Courier New"'],
];
const settings = {};
function saveSettings() {
  try { window.zchatSaveSettings(String(settings.size || ""), settings.font || ""); } catch {}
}
function applySettings() {
  document.documentElement.style.setProperty("--size", (settings.size || 14) + "px");
  const font = fonts.find(f => f[0] === settings.font) || fonts[0];
  log.style.fontFamily = input.style.fontFamily = mentionsBox.style.fontFamily =
    font[1] === "var(--font)" ? "" : font[1] + ", var(--font)";
}
const fontSelect = document.getElementById("font");
for (const [name] of fonts) {
  const o = document.createElement("option");
  o.textContent = name;
  fontSelect.appendChild(o);
}
fontSelect.value = settings.font || "Default";
fontSelect.onchange = () => { settings.font = fontSelect.value; saveSettings(); applySettings(); };
document.getElementById("smaller").onclick = () => {
  settings.size = Math.max(9, (settings.size || 14) - 1); saveSettings(); applySettings();
};
document.getElementById("bigger").onclick = () => {
  settings.size = Math.min(32, (settings.size || 14) + 1); saveSettings(); applySettings();
};
applySettings();

// --- ANSI (SGR) to HTML: the chat core writes lines as a terminal shows them.
function rgb(parts, i) { return `rgb(${parts[i]},${parts[i + 1]},${parts[i + 2]})`; }
const basic = ["#000", "#c33", "#3a3", "#cc3", "#36c", "#c3c", "#3cc", "#ccc"];
const bright = ["#7d8491", "#f66", "#6d6", "#ee6", "#69f", "#f6f", "#6ee", "#fff"];
function ansiToNodes(text, into) {
  let st = {};
  const parts = text.split(/\x1b\[([0-9;]*)m/);
  for (let i = 0; i < parts.length; i++) {
    if (i % 2 === 1) {
      const p = parts[i] === "" ? [0] : parts[i].split(";").map(Number);
      for (let j = 0; j < p.length; j++) {
        const c = p[j];
        if (c === 0) st = {};
        else if (c === 1) st.bold = true;
        else if (c === 22) st.bold = false;
        else if (c === 3) st.italic = true;
        else if (c === 23) st.italic = false;
        else if (c === 4) st.underline = true;
        else if (c === 24) st.underline = false;
        else if (c === 9) st.strike = true;
        else if (c === 29) st.strike = false;
        else if (c === 38 && p[j + 1] === 2) { st.fg = rgb(p, j + 2); j += 4; }
        else if (c === 48 && p[j + 1] === 2) { st.bg = rgb(p, j + 2); j += 4; }
        else if (c === 39) delete st.fg;
        else if (c === 49) delete st.bg;
        else if (c >= 30 && c <= 37) st.fg = basic[c - 30];
        else if (c >= 90 && c <= 97) st.fg = bright[c - 90];
        else if (c >= 40 && c <= 47) st.bg = basic[c - 40];
      }
      continue;
    }
    if (!parts[i]) continue;
    const span = document.createElement("span");
    span.textContent = parts[i];
    if (st.fg) span.style.color = st.fg;
    if (st.bg) span.style.background = st.bg;
    if (st.bold) span.style.fontWeight = "bold";
    if (st.italic) span.style.fontStyle = "italic";
    const deco = [st.underline && "underline", st.strike && "line-through"].filter(Boolean).join(" ");
    if (deco) span.style.textDecoration = deco;
    into.appendChild(span);
  }
}

function atBottom() { return log.scrollHeight - log.scrollTop - log.clientHeight < 40; }

const maxLines = 3000;
window.zchat = {
  print(text) {
    const stick = atBottom();
    const div = document.createElement("div");
    // Several lines in one print are a picture (or the paint canvas): its characters touch.
    div.className = text.includes("\n") ? "block" : "line";
    ansiToNodes(text, div);
    log.appendChild(div);
    while (log.childElementCount > maxLines) log.firstElementChild.remove();
    if (stick) log.scrollTop = log.scrollHeight;
  },
  // A real picture: the line saying who sent it, then the picture, which can be opened big with a click. frames is
  // [[src, delay], ...]: one for a still picture or a GIF (which plays by itself), more for an animation.
  image(line, width, height, frames) {
    const stick = atBottom();
    const div = document.createElement("div");
    div.className = "picture";
    const head = document.createElement("div");
    head.className = "line";
    ansiToNodes(line, head);
    const img = document.createElement("img");
    img.width = width;
    img.height = height;
    img.alt = "picture";
    animate(img, frames);
    img.onclick = () => openViewer(frames);
    // Once, when it first shows (an animation loads each frame): kept at the bottom unless scrolled away since.
    img.addEventListener("load", () => {
      if (stick && log.scrollHeight - log.scrollTop - log.clientHeight < img.offsetHeight + 40) {
        log.scrollTop = log.scrollHeight;
      }
    }, { once: true });
    div.append(head, img);
    log.appendChild(div);
    while (log.childElementCount > maxLines) log.firstElementChild.remove();
    if (stick) log.scrollTop = log.scrollHeight;
  },
  // A file: the line saying who sent it, then its name and size, and a button that saves it (typing "/save INDEX").
  file(line, index, name, size) {
    const stick = atBottom();
    const div = document.createElement("div");
    const head = document.createElement("div");
    head.className = "line";
    ansiToNodes(line, head);
    const card = document.createElement("div");
    card.className = "file";
    const title = document.createElement("span");
    title.className = "name";
    title.textContent = "📎 " + name;
    const info = document.createElement("span");
    info.className = "size";
    info.textContent = size;
    const save = document.createElement("button");
    save.textContent = "Download";
    save.title = "Save it in your downloads folder";
    save.onclick = () => window.zchatSend("/save " + index);
    card.append(title, info, save);
    div.append(head, card);
    log.appendChild(div);
    while (log.childElementCount > maxLines) log.firstElementChild.remove();
    if (stick) log.scrollTop = log.scrollHeight;
  },
  bell() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator(), gain = ctx.createGain();
      osc.frequency.value = 880;
      gain.gain.setValueAtTime(0.15, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.25);
      osc.connect(gain).connect(ctx.destination);
      osc.start(); osc.stop(ctx.currentTime + 0.25);
    } catch {}
    if (!document.hasFocus()) {
      document.title = "(!) zchat";
      window.addEventListener("focus", () => { document.title = "zchat"; }, { once: true });
    }
  },
  // A trill (/trill): a sound, as a data: URL, played once as it arrives.
  sound(src) {
    new Audio(src).play().catch(() => {});
  },
  info(i) {
    port = i.port || 0;
    showHeader();
  },
  // Another channel is joined: it shows only what is said there.
  clear() {
    log.textContent = "";
  },
};

// --- Channels: listed from zchatChannels() ([[name, public, member, current, unread], ...]); a click joins one.
let port = 0, currentChannel = "general", channelsShown = "";
function showHeader() {
  document.getElementById("channel").textContent = "# " + currentChannel + (port ? `  ·  UDP port ${port}` : "");
}
async function refreshChannels() {
  let channels = [];
  try { channels = await window.zchatChannels(); } catch {}
  const shown = JSON.stringify(channels);
  if (shown === channelsShown) return;
  channelsShown = shown;
  const box = document.getElementById("channels");
  box.textContent = "";
  channelList = channels;
  for (const [name, isPublic, member, current, unread] of channels) {
    const item = document.createElement("div");
    item.className = "item" + (current ? " active" : "") + (member ? "" : " away");
    item.title = (isPublic ? "Public" : "Private") + (member ? "" : ": click to join");
    const label = document.createElement("span");
    label.textContent = "# " + name;
    item.append(label);
    if (!isPublic) {
      const lock = document.createElement("span");
      lock.className = "lock";
      lock.textContent = "🔒";
      item.append(lock);
    }
    if (unread && !current) {
      const dot = document.createElement("span");
      dot.className = "dot";
      item.append(dot);
    }
    if (!member) {
      const join = document.createElement("button");
      join.className = "act join";
      join.textContent = "Join";
      join.title = "Join #" + name;
      item.append(join);
    } else if (name !== "general") {
      const leave = document.createElement("button");
      leave.className = "act leave";
      leave.textContent = "×";
      leave.title = "Leave #" + name;
      leave.onclick = e => { e.stopPropagation(); channelCommand("/leave " + name); };
      item.append(leave);
    }
    item.onclick = () => channelCommand("/join " + name);
    box.appendChild(item);
    if (current) currentChannel = name;
  }
  showHeader();
  showChannelActions();
}
// Runs a channel command, as typed; what it says shows in the chat.
function channelCommand(line) {
  window.zchatSend(line);
  for (const ms of [150, 600]) setTimeout(() => { refreshChannels(); if (channelPanel.classList.contains("open")) showChannelPanel(); }, ms);
}
let channelList = [];
function showChannelActions() {
  const here = channelList.find(c => c[3]);
  const general = !here || here[0] === "general";
  document.getElementById("channel-leave").hidden = general;
  document.getElementById("channel-delete").hidden = general || !here[5];
}
document.getElementById("channel-leave").onclick = () => channelCommand("/leave " + currentChannel);
// Deleting asks for a second click.
const deleteButton = document.getElementById("channel-delete");
deleteButton.onclick = () => {
  if (!deleteButton.classList.contains("armed")) {
    deleteButton.classList.add("armed");
    deleteButton.textContent = "Click again to delete";
    clearTimeout(deleteButton._timer);
    deleteButton._timer = setTimeout(() => { deleteButton.classList.remove("armed"); deleteButton.textContent = "Delete"; }, 3000);
    return;
  }
  clearTimeout(deleteButton._timer);
  deleteButton.classList.remove("armed");
  deleteButton.textContent = "Delete";
  channelCommand("/delete " + currentChannel);
};

// --- The members of the current channel (zchatChannelPeople), each with a button to remove them, and the others in
// the chat, each with one to add them.
const channelPanel = document.getElementById("channel-panel");
let selfName = "";
function personRow(name, style, hash, button) {
  const row = document.createElement("div");
  row.className = "person";
  const avatar = document.createElement("span");
  avatar.className = "avatar";
  setAvatar(avatar, name, style, hash);
  const who = document.createElement("span");
  who.className = "who";
  who.textContent = name + (name === selfName ? " (you)" : "");
  who.style.color = styleColor(style);
  row.append(avatar, who);
  if (button) row.append(button);
  return row;
}
function actionButton(text, cls, line) {
  const b = document.createElement("button");
  b.textContent = text;
  b.className = cls;
  b.onclick = () => channelCommand(line);
  return b;
}
async function showChannelPanel() {
  const channel = currentChannel;
  let people = null;
  try { people = await window.zchatChannelPeople(channel); } catch {}
  channelPanel.textContent = "";
  const title = document.createElement("div");
  title.className = "title";
  title.textContent = "# " + channel;
  const close = document.createElement("button");
  close.textContent = "×";
  close.title = "Close";
  close.onclick = () => channelPanel.classList.remove("open");
  title.append(close);
  channelPanel.append(title);
  if (!people) {
    channelPanel.append(Object.assign(document.createElement("div"), { className: "note", textContent: "Not available." }));
    return;
  }
  const general = channel === "general";
  const h = document.createElement("h3");
  h.textContent = "Members (" + (people.members.length + people.away) + ")";
  channelPanel.append(h);
  for (const [name, style, hash] of people.members) {
    const button = general ? null
      : name === selfName ? actionButton("Leave", "remove", "/leave " + channel)
      : actionButton("Remove", "remove", "/remove #" + channel + " " + name);
    channelPanel.append(personRow(name, style, hash, button));
  }
  if (people.away) {
    channelPanel.append(Object.assign(document.createElement("div"), { className: "note",
      textContent: "and " + people.away + " not in the chat now" }));
  }
  if (general) {
    channelPanel.append(Object.assign(document.createElement("div"), { className: "note",
      textContent: "Everybody is always in #general." }));
    return;
  }
  const h2 = document.createElement("h3");
  h2.textContent = "Add people";
  channelPanel.append(h2);
  if (!people.others.length) {
    channelPanel.append(Object.assign(document.createElement("div"), { className: "note",
      textContent: "Everybody in the chat is in it (people with an older zchat cannot be added)." }));
  }
  for (const [name, style, hash] of people.others) {
    channelPanel.append(personRow(name, style, hash, actionButton("Add", "add", "/add #" + channel + " " + name)));
  }
}
document.getElementById("channel-members").onclick = () => {
  if (channelPanel.classList.toggle("open")) showChannelPanel();
};
setInterval(() => { if (channelPanel.classList.contains("open")) showChannelPanel(); }, 2000);
document.addEventListener("mousedown", e => {
  if (channelPanel.classList.contains("open") && !channelPanel.contains(e.target) &&
      e.target.id !== "channel-members") {
    channelPanel.classList.remove("open");
  }
});
document.addEventListener("keydown", e => { if (e.key === "Escape") channelPanel.classList.remove("open"); });
setInterval(refreshChannels, 1000);
const newChannel = document.getElementById("new-channel");
const newChannelName = document.getElementById("new-channel-name");
document.getElementById("add-channel").onclick = () => {
  newChannel.classList.toggle("open");
  if (newChannel.classList.contains("open")) { newChannelName.value = ""; newChannelName.focus(); }
};
function createChannel() {
  const name = newChannelName.value.trim().replace(/^#/, "");
  if (!name) return;
  window.zchatSend("/create " + name + " " + document.getElementById("new-channel-kind").value);
  newChannel.classList.remove("open");
  input.focus();
  setTimeout(refreshChannels, 150);
}
document.getElementById("new-channel-create").onclick = createChannel;
document.getElementById("new-channel-cancel").onclick = () => { newChannel.classList.remove("open"); input.focus(); };
newChannelName.addEventListener("keydown", e => {
  if (e.key === "Enter") { createChannel(); e.preventDefault(); }
  else if (e.key === "Escape") { newChannel.classList.remove("open"); input.focus(); e.preventDefault(); }
});

// --- Animations: the frames of an image element, shown one after the other for their delays, in a loop, while the
// element is on the page.
function animate(img, frames) {
  img.src = frames[0][0];
  if (frames.length < 2) return;
  // Loaded and decoded ahead, and kept, so frames do not flicker or stutter.
  img._frames = frames.map(([src]) => { const f = new Image(); f.src = src; f.decode().catch(() => {}); return f; });
  let i = 0;
  const next = () => {
    if (!img.isConnected && img !== viewer.querySelector("img")) return;
    i = (i + 1) % frames.length;
    img.src = frames[i][0];
    img._timer = setTimeout(next, Math.max(20, frames[i][1]));
  };
  clearTimeout(img._timer);
  img._timer = setTimeout(next, Math.max(20, frames[0][1]));
}

// --- Opening a picture big, over the chat: a click, or Escape, closes it.
const viewer = document.getElementById("viewer");
function openViewer(frames) {
  animate(viewer.querySelector("img"), frames);
  viewer.style.display = "grid";
}
viewer.onclick = () => { viewer.style.display = "none"; clearTimeout(viewer.querySelector("img")._timer); };
document.addEventListener("keydown", e => { if (e.key === "Escape") viewer.style.display = "none"; });

// --- People: the names that can be tagged, which are the people in the chat.
function styleColor(style) {
  const m = /38;2;(\d+);(\d+);(\d+)/.exec(style || "");
  return m ? `rgb(${m[1]},${m[2]},${m[3]})` : "";
}
async function mentions() {
  try { return await window.zchatMentions(); } catch { return []; }
}
// Avatars: the picture of a hash, from zchatAvatar(), kept once it is here (until then, asked for again).
const avatarFrames = new Map();
async function framesOf(hash) {
  if (avatarFrames.has(hash)) return avatarFrames.get(hash);
  let frames = null;
  try { frames = await window.zchatAvatar(hash); } catch {}
  if (frames) avatarFrames.set(hash, frames);
  return frames;
}
// A circle in the color, with the initial; or the avatar picture, when there is one.
function paintAvatar(avatar, name, color, hash) {
  avatar.style.background = color;
  const key = name + "\n" + color + "\n" + (hash || "");
  if (avatar._key === key && (!hash || avatar._img)) return;
  avatar._key = key;
  if (!avatar._img || avatar._hash !== hash) {
    avatar._img = null;
    avatar._hash = hash;
    avatar.textContent = name.trim().charAt(0).toUpperCase();
  }
  if (!hash) return;
  framesOf(hash).then(frames => {
    if (!frames || avatar._key !== key || avatar._img) return;
    const img = document.createElement("img");
    img.alt = "";
    animate(img, frames);
    avatar.textContent = "";
    avatar.append(img);
    avatar._img = img;
  });
}
function setAvatar(avatar, name, style, hash) {
  paintAvatar(avatar, name, styleColor(style) || "#888", hash);
}
let selfAvatar = "";
// Our own name and avatar, above the channels.
async function refreshSelf() {
  let self = null;
  try { self = await window.zchatSelf(); } catch {}
  if (!self) return;
  const [name, style, avatar] = self;
  selfAvatar = avatar || "";
  selfName = name;
  const me = document.getElementById("me");
  setAvatar(me.querySelector(".avatar"), name, style, selfAvatar);
  if (profile.classList.contains("open")) showProfilePreview();
  const label = me.querySelector(".name");
  label.textContent = name;
  label.title = name;
  label.style.color = styleColor(style);
}
// --- Changing our name and color, by clicking them: sent as /nick and /color, like typing them.
const profile = document.getElementById("profile");
const profileName = document.getElementById("profile-name");
const profileColor = document.getElementById("profile-color");
let current = { name: "", color: "" };
function toHex(rgb) {
  const m = /rgb\((\d+),\s*(\d+),\s*(\d+)\)/.exec(rgb || "");
  return m ? "#" + m.slice(1).map(n => (+n).toString(16).padStart(2, "0")).join("") : "#888888";
}
function showProfilePreview() {
  const name = profileName.value.trim() || current.name;
  paintAvatar(profile.querySelector(".preview .avatar"), name, profileColor.value, selfAvatar);
  const label = profile.querySelector(".preview .name");
  label.textContent = name;
  label.style.color = profileColor.value;
  document.getElementById("profile-hex").textContent = profileColor.value;
}
const swatches = ["#e63232", "#ff8800", "#f2c94c", "#3fb950", "#2ec4b6", "#4d8dff", "#9b5de5", "#f15bb5",
                  "#ff6b6b", "#ffb86b", "#c3e88d", "#7ee787", "#89ddff", "#a5b4fc", "#d4a5ff", "#ffffff"];
for (const color of swatches) {
  const swatch = document.createElement("span");
  swatch.style.background = color;
  swatch.title = color;
  swatch.onclick = () => { profileColor.value = color; showProfilePreview(); };
  document.getElementById("profile-swatches").appendChild(swatch);
}
function openProfile() {
  const me = document.getElementById("me");
  current = { name: me.querySelector(".name").textContent, color: toHex(me.querySelector(".name").style.color) };
  profileName.value = current.name;
  profileColor.value = current.color;
  showProfilePreview();
  profile.classList.add("open");
  profileName.focus();
  profileName.select();
}
function closeProfile() {
  profile.classList.remove("open");
  input.focus();
}
function saveProfile() {
  const name = profileName.value.trim();
  if (name && name !== current.name) window.zchatSend("/nick " + name);
  if (profileColor.value.toLowerCase() !== current.color.toLowerCase()) window.zchatSend("/color " + profileColor.value);
  closeProfile();
  setTimeout(refreshSelf, 150);
}
document.getElementById("me").onclick = () => profile.classList.contains("open") ? closeProfile() : openProfile();
profileName.oninput = showProfilePreview;
profileColor.oninput = showProfilePreview;
document.getElementById("profile-random").onclick = () => {
  // Any hue, bright enough to read on the dark background.
  const h = Math.random() * 360, s = 0.75, l = 0.6;
  const f = n => { const k = (n + h / 30) % 12; return Math.round(255 * (l - s * Math.min(l, 1 - l) * Math.max(-1, Math.min(k - 3, 9 - k, 1)))); };
  profileColor.value = "#" + [f(0), f(8), f(4)].map(v => v.toString(16).padStart(2, "0")).join("");
  showProfilePreview();
};
// A file chosen is saved where zchat can read it (like a dropped one), then set with /avatar.
const profileNote = document.getElementById("profile-note");
function afterAvatarChange() {
  // Made into an avatar by zchat, which takes a moment for a big GIF.
  for (const ms of [200, 700, 1500, 3000]) setTimeout(refreshSelf, ms);
}
document.getElementById("profile-upload").onclick = () => document.getElementById("profile-file").click();
document.getElementById("profile-file").onchange = e => {
  const file = e.target.files[0];
  e.target.value = "";
  if (!file) return;
  profileNote.textContent = "Setting " + file.name + "…";
  const reader = new FileReader();
  reader.onload = async () => {
    const base64 = String(reader.result).replace(/^data:[^,]*,/, "");
    let path = null;
    try { path = await window.zchatDrop(file.name, base64); } catch {}
    if (!path) { profileNote.textContent = "Could not read " + file.name + "."; return; }
    window.zchatSend('/avatar "' + path + '"');
    profileNote.textContent = "Everybody sees it; a GIF plays. It changes right away.";
    afterAvatarChange();
  };
  reader.readAsDataURL(file);
};
document.getElementById("profile-remove").onclick = () => {
  window.zchatSend("/avatar none");
  afterAvatarChange();
};
document.getElementById("profile-save").onclick = saveProfile;
document.getElementById("profile-cancel").onclick = closeProfile;
profile.addEventListener("keydown", e => {
  if (e.key === "Enter") { saveProfile(); e.preventDefault(); }
  else if (e.key === "Escape") { closeProfile(); e.preventDefault(); e.stopPropagation(); }
});
document.addEventListener("mousedown", e => {
  if (profile.classList.contains("open") && !profile.contains(e.target) && !document.getElementById("me").contains(e.target)) {
    closeProfile();
  }
});

let peopleShown = "";
async function refreshPeople() {
  refreshSelf();
  const people = (await mentions()).filter(([name]) => name !== "everyone");
  const box = document.getElementById("people");
  // Rebuilt only when it changes, so avatars that play keep playing.
  const shown = JSON.stringify(people);
  if (shown === peopleShown) {
    // Avatars that were not here yet.
    [...box.children].forEach((item, i) => setAvatar(item.firstChild, ...people[i]));
    return;
  }
  peopleShown = shown;
  box.textContent = "";
  for (const [name, style, hash] of people) {
    const item = document.createElement("div");
    item.className = "item";
    const avatar = document.createElement("span");
    avatar.className = "avatar";
    setAvatar(avatar, name, style, hash);
    const label = document.createElement("span");
    label.textContent = name;
    label.style.color = styleColor(style);
    item.append(avatar, label);
    box.appendChild(item);
  }
}
setInterval(refreshPeople, 2000);

// --- Input: Enter sends, Up/Down go through what was sent, '@' opens the list of people.
const sent = [];
let sentPos = 0, draft = "";
let list = [], selected = 0, atStart = -1;

function closeMentions() { mentionsBox.style.display = "none"; atStart = -1; list = []; }
async function updateMentions() {
  const caret = input.selectionStart;
  const before = input.value.slice(0, caret);
  const at = before.lastIndexOf("@");
  if (at < 0 || (at > 0 && /\w/.test(before[at - 1])) || /\s/.test(before.slice(at + 1))) {
    closeMentions();
    return;
  }
  const typed = before.slice(at + 1).toLowerCase();
  const people = await mentions();
  list = people.filter(([name]) => name.toLowerCase().startsWith(typed));
  if (!list.length) { closeMentions(); return; }
  atStart = at;
  selected = Math.min(selected, list.length - 1);
  mentionsBox.textContent = "";
  list.forEach(([name, style, hash], i) => {
    const d = document.createElement("div");
    const avatar = document.createElement("span");
    avatar.className = "avatar";
    setAvatar(avatar, name, style, hash);
    const label = document.createElement("span");
    label.textContent = "@" + name;
    d.append(avatar, label);
    d.style.color = styleColor(style);
    if (i === selected) d.className = "selected";
    d.onmousedown = e => { e.preventDefault(); acceptMention(i); };
    mentionsBox.appendChild(d);
  });
  mentionsBox.style.display = "block";
}
function acceptMention(i) {
  const [name] = list[i];
  const caret = input.selectionStart;
  input.value = input.value.slice(0, atStart) + "@" + name + " " + input.value.slice(caret);
  const pos = atStart + name.length + 2;
  input.setSelectionRange(pos, pos);
  closeMentions();
}

input.addEventListener("keydown", e => {
  if (mentionsBox.style.display === "block") {
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      selected = (selected + (e.key === "ArrowDown" ? 1 : list.length - 1)) % list.length;
      updateMentions();
      e.preventDefault();
      return;
    }
    if (e.key === "Tab" || e.key === "Enter") { acceptMention(selected); e.preventDefault(); return; }
    if (e.key === "Escape") { closeMentions(); e.preventDefault(); return; }
  }
  if (e.key === "Enter") {
    const line = input.value;
    input.value = "";
    if (line.trim() && sent[sent.length - 1] !== line) sent.push(line);
    sentPos = sent.length;
    draft = "";
    window.zchatSend(line);
    // A new name or color (/nick, /color) shows right away.
    setTimeout(refreshSelf, 150);
    e.preventDefault();
  } else if (e.key === "ArrowUp" && sentPos > 0) {
    if (sentPos === sent.length) draft = input.value;
    input.value = sent[--sentPos];
    e.preventDefault();
  } else if (e.key === "ArrowDown" && sentPos < sent.length) {
    input.value = ++sentPos === sent.length ? draft : sent[sentPos];
    e.preventDefault();
  }
});
input.addEventListener("input", async e => {
  selected = 0;
  updateMentions();
  // A pasted path of an image becomes the /image command for it, like a file dropped on a terminal.
  if (e.inputType === "insertFromPaste") {
    try {
      const rewritten = await window.zchatRewrite(input.value);
      if (rewritten) input.value = rewritten;
    } catch {}
  }
});
input.addEventListener("blur", () => setTimeout(closeMentions, 150));
// Typing anywhere types in the input box, except in another field (like the name in the profile panel).
document.addEventListener("keydown", e => {
  const el = document.activeElement;
  const field = el && el !== input && (el.matches("input, textarea, select") || el.isContentEditable);
  if (el !== input && !field && !e.ctrlKey && !e.metaKey && e.key.length === 1) input.focus();
});

// --- Dropping a file: saved where zchat can read it, then the command sending it is typed: /image for a picture,
// /file for anything else.
let dragDepth = 0;
window.addEventListener("dragenter", e => { e.preventDefault(); dragDepth++; document.body.classList.add("dragging"); });
window.addEventListener("dragleave", () => { if (--dragDepth <= 0) { dragDepth = 0; document.body.classList.remove("dragging"); } });
window.addEventListener("dragover", e => e.preventDefault());
window.addEventListener("drop", e => {
  e.preventDefault();
  dragDepth = 0;
  document.body.classList.remove("dragging");
  const file = e.dataTransfer.files[0];
  if (!file) return;
  if (file.size > 34 * 1024 * 1024) { zchat.print("That file is too big to send."); return; }
  const reader = new FileReader();
  reader.onload = async () => {
    const base64 = String(reader.result).replace(/^data:[^,]*,/, "");
    try {
      const path = await window.zchatDrop(file.name, base64);
      if (path) {
        const quoted = /\s/.test(path) ? '"' + path + '"' : path;
        input.value = (await window.zchatRewrite(quoted)) || "/file " + quoted;
        input.focus();
      }
    } catch {}
  };
  reader.readAsDataURL(file);
});

input.focus();
(async () => {
  try {
    const [size, font] = await window.zchatSettings();
    if (+size) settings.size = +size;
    if (font) { settings.font = font; fontSelect.value = font; }
    applySettings();
  } catch {}
  window.zchatReady();
  refreshPeople();
})();
</script>
