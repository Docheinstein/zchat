<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232838"/>
      <stop offset="1" stop-color="#111317"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#6ea8ff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#6ea8ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff6156"/>
      <stop offset="1" stop-color="#d81e1e"/>
    </linearGradient>
    <linearGradient id="white" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d3d8e2"/>
    </linearGradient>
    <clipPath id="z">
      <polygon points="100,100 412,100 412,180 214,332 412,332 412,412 100,412 100,332 298,180 100,180"/>
    </clipPath>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#glow)"/>

  <!-- outline of the Z -->
  <polygon points="100,100 412,100 412,180 214,332 412,332 412,412 100,412 100,332 298,180 100,180"
           fill="#14161c" stroke="#14161c" stroke-width="36" stroke-linejoin="round"/>

  <!-- pokeball inside the Z: red top, white bottom, black band across the middle -->
  <g clip-path="url(#z)">
    <rect x="0" y="0" width="512" height="256" fill="url(#red)"/>
    <rect x="0" y="256" width="512" height="256" fill="url(#white)"/>
    <rect x="0" y="238" width="512" height="36" fill="#14161c"/>
    <rect x="118" y="114" width="150" height="20" rx="10" fill="#ffffff" opacity="0.35"/>
  </g>

  <!-- button in the middle of the diagonal -->
  <circle cx="256" cy="256" r="46" fill="#ffffff" stroke="#14161c" stroke-width="18"/>
  <circle cx="256" cy="256" r="18" fill="none" stroke="#c9ced8" stroke-width="6"/>
</svg>
